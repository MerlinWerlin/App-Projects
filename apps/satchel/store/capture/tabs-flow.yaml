# Proof for Jared's 1.0 feedback (Satchel), at the largest text size (set by the workflow with simctl ui
# content_size): every tab label, SOS included, on one line; no split words on the Emergency tab; and the Itinerary
# tab scrolls as one page to the end of a busy day (it used to scroll only in a thin box under a fixed header).
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: z4-tabs-largest-text
- openLink: satchel://emergency
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: z5-emergency-largest-text
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: z6-emergency-largest-text-2
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: z7-emergency-largest-text-3
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: z8-emergency-largest-text-4
- openLink: satchel://schedule
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: s0-itinerary-largest-text
- repeat:
    times: 12
    commands:
      - scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s1-itinerary-largest-text-end
# Multiple trips (last, since the pick is kept): Home's Your trips row, then pick the second trip and see Home and the Itinerary tab follow it.
- openLink: satchel://
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "Bali with Mum.*"
    direction: DOWN
    timeout: 10000
    optional: true
- takeScreenshot: m0-home-two-trips
- tapOn:
    text: "Bali with Mum.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- repeat:
    times: 4
    commands:
      - swipe:
          direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: m1-home-picked-bali
- openLink: satchel://schedule
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: m2-itinerary-picked-bali
