# App Store captures for Satchel 1.0.0 (Maestro, iOS simulator). Run by .github/workflows/satchel-store-capture.yml
# after seed.py has put the invented Tokyo & Kyoto trip on the simulator. Deep links only (satchel://...), plus
# optional taps, so one miss never loses the other screens. ${MODE} is light or dark (file name suffix).
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
- waitForAnimationToEnd:
    timeout: 15000

- openLink: satchel://schedule
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-itinerary-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 01b-itinerary-scrolled-${MODE}

- openLink: satchel://trip/japan-autumn
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-trip-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 02b-trip-scrolled-${MODE}

- openLink: satchel://ticket/f1
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03-ticket-${MODE}

- openLink: satchel://wallet
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-wallet-${MODE}

- openLink: satchel://emergency
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 05-emergency-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 05b-emergency-scrolled-${MODE}

- openLink: satchel://map
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible: ".*Tokyo.*"
    timeout: 10000
    optional: true
- takeScreenshot: 06-map-${MODE}

- openLink: satchel://phrases
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 07-phrases-${MODE}

# Paste path: the workflow has put invented plans on the simulator's clipboard (simctl pbcopy).
- openLink: satchel://itinerary?tripId=japan-autumn&start=paste
- runFlow:
    when:
      visible: "Allow Paste"
    commands:
      - tapOn: "Allow Paste"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 08-paste-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 08b-paste-scrolled-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 08c-paste-scrolled-${MODE}

# Passport page (stamps on paper texture): checked by eye, not a store shot.
- openLink: satchel://passport
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 10-passport-${MODE}

# Share itinerary: the sheet, then "Satchel trip file" hands a .satchel file to the system share sheet.
- openLink: satchel://schedule
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "Share itinerary"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-share-sheet-${MODE}
- tapOn:
    text: "Satchel trip file"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 09b-share-satchel-file-${MODE}
