# Proof for Jared's 1.0 feedback (Satchel): with the Tokyo, Kyoto and Sydney packs installed (maps.py), each city is
# zoomed in as far as the map allows (double taps on an empty spot). Every shot must still show street tiles, never a
# blank map. Then the tab bar is captured. Run by .github/workflows/satchel-store-capture.yml after the store shots.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
- waitForAnimationToEnd:
    timeout: 15000
- openLink: satchel://map
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: z0-tokyo-start
- repeat:
    times: 10
    commands:
      - doubleTapOn:
          point: "80%,26%"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: z1-tokyo-zoomed-max
- tapOn:
    text: "Show Kyoto on the map"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- repeat:
    times: 10
    commands:
      - doubleTapOn:
          point: "60%,30%"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: z2-kyoto-zoomed-max
- tapOn:
    text: 'Show Sydney.* on the map'
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- repeat:
    times: 10
    commands:
      - doubleTapOn:
          point: "60%,30%"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: z3-sydney-zoomed-max
# Multiple trips (normal text size): Home's Your trips row, pick the second trip and see Home and the Itinerary tab
# follow it, then pick the first one back (the pick is kept on the phone).
- openLink: satchel://
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: m0-home-two-trips
- tapOn:
    text: "Bali with Mum, .*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: m1-home-picked-bali
- openLink: satchel://schedule
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: m2-itinerary-picked-bali
- openLink: satchel://
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "Girls trip, .*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
