# MerlinWerlin/App-Projects: branch builds are previews; publishing requires an explicit main-branch dispatch.
name: satchel-maps-publish

on:
  push:
    branches: ['codex/satchel-map-system-*']
    paths: ['apps/satchel/tools/maps/**', '.github/workflows/satchel-maps-publish.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match the app)'
        required: true
        default: 'satchel-maps-v1'
        type: string
      ratio:
        description: 'Pixel ratio (2 = sharp on iPhone)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2']
      publish:
        description: 'Publish verified packs for app downloads (main only)'
        default: false
        type: boolean

concurrency:
  group: satchel-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: App tests (includes real pack and demo-place regressions)
        working-directory: apps/satchel
        run: |
          node --test tools/maps/*.test.mjs
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-concurrency=4 'src/**/*.test.ts'
  build:
    needs: app-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      TAG: ${{ inputs.tag || 'satchel-maps-v1' }}
      RATIO: ${{ inputs.ratio || '2' }}
    defaults:
      run:
        working-directory: apps/satchel/tools/maps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release contract
        run: |
          node --input-type=module -e "import {MAPS_RELEASE} from '../../src/core/citymaps.ts'; if (process.env.TAG !== MAPS_RELEASE) throw Error('Tag must match the app');"
      - name: System libraries for MapLibre Native
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libcurl4 libglfw3 libuv1 libpng16-16 libicu74 libjpeg-turbo8 libwebp7 libopengl0 libegl1 libgles2 mesa-utils
      - name: Install pmtiles CLI
        run: |
          gh release download v1.31.2 -R protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' -D /tmp/pmt
          tar -xzf /tmp/pmt/*.tar.gz -C /tmp/pmt
          sudo install /tmp/pmt/pmtiles /usr/local/bin/pmtiles
          pmtiles --help > /dev/null
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build real city packs
        run: xvfb-run -a -s "-screen 0 1024x768x24" node build.mjs --ratio "$RATIO" --out out
      - name: Verify packs with the app parsers and render review images
        run: node verify.mjs out "$RATIO"
      - name: Keep packs and visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satchel-city-maps-${{ github.run_id }}
          path: |
            apps/satchel/tools/maps/out/*.tar
            apps/satchel/tools/maps/out/catalog.json
            apps/satchel/tools/maps/out/*preview.png
            apps/satchel/tools/maps/out/verification.json
            apps/satchel/tools/maps/out/*-poi-source.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish verified packs, then catalog.json last
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        run: |
          gh release view "$TAG" -R "$R" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$R" --title "Satchel offline city maps ($TAG)" --latest=false \
              --notes "Map data © OpenStreetMap contributors (ODbL), via Protomaps. Style: Protomaps basemaps (BSD-3). POI extracts in each pack are available under ODbL."
          cd out
          xargs -a upload-1-packs.txt -d '\n' -n 10 gh release upload "$TAG" -R "$R" --clobber
          gh release upload "$TAG" -R "$R" --clobber catalog.json
          want=$(sha256sum catalog.json | cut -d' ' -f1)
          got=$(curl --retry 5 --retry-delay 5 -fsSL "https://github.com/$R/releases/download/$TAG/catalog.json" | sha256sum | cut -d' ' -f1)
          [ "$want" = "$got" ]
          echo "Published and verified $TAG catalog ($want)" >> "$GITHUB_STEP_SUMMARY"
