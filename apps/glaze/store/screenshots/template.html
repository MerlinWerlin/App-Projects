<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glaze store shot</title>
<!--
  T267: one App Store screenshot. render.mjs sets window.DATA, calls renderShot() and captures the
  viewport (exact pixel size, JPEG, no alpha). The stage is laid out at 1320 px wide and scaled to
  the target width; the phone screen inside is laid out in iPhone points (440 x 956) like the app.
  Colours and type follow src/core/designV2.ts (lightV2, typeV2); copy is the app's English strings.
-->
<style>
  :root {
    --bg: #F4F1F7; --surface: #FFFFFF; --fill: #ECE7F1; --separator: #E2DBE8;
    --ink: #1D1A21; --ink2: #5E5766; --ink3: #8A8292; --tint: #A2337F; --tintSoft: #FBE1F1; --onTintSoft: #7A1F5E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1320px; transform-origin: 0 0; overflow: hidden; }
  .caption { position: absolute; left: 90px; right: 90px; top: 0; height: 640px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .caption h1 { font: 800 104px/1.06 'Inter Display', 'Inter', sans-serif; letter-spacing: -2.5px; color: #1D1A21; text-wrap: balance; }
  .caption h1.long { font-size: 88px; }
  .caption .accent { color: #A2337F; }
  .caption p.accent { font: 800 76px/1.1 'Inter Display', 'Inter', sans-serif; letter-spacing: -1.6px; margin-top: 26px; text-wrap: balance; }
  .phone { position: absolute; left: 160px; top: 664px; width: 1000px; height: 2126px; border-radius: 150px; background: #17141B; padding: 20px;
           box-shadow: 0 40px 90px rgba(60, 20, 70, .28), 0 8px 24px rgba(60, 20, 70, .18), inset 0 0 0 3px #2C2830; }
  .screenwrap { width: 960px; height: 2086px; border-radius: 131px; overflow: hidden; position: relative; background: #000; }
  .screen { position: absolute; left: 0; top: 0; width: 440px; height: 956px; transform: scale(2.181818); transform-origin: 0 0; overflow: hidden; }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000; z-index: 50; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 4px 34px 0 50px; font: 600 17px Inter; z-index: 40; }
  .status .r { display: flex; gap: 7px; align-items: center; }
  .wall { position: absolute; inset: 0; background-size: cover; background-position: center; }

  /* Home Screen */
  .grid { position: absolute; left: 0; right: 0; }
  .app { position: absolute; width: 80px; display: flex; flex-direction: column; align-items: center; }
  .app .lbl { font: 500 12px/16px Inter; margin-top: 5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); white-space: nowrap; }
  .widget { position: absolute; border-radius: 24px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .widget .art { position: absolute; inset: 0; background-repeat: no-repeat; background-position: center; background-size: contain; }
  .widget .rim { position: absolute; inset: 0; border-radius: 24px; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.28); }
  .dock { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 96px; border-radius: 34px; backdrop-filter: blur(18px); background: rgba(255,255,255,.2); }
  .search { position: absolute; left: 50%; bottom: 124px; transform: translateX(-50%); padding: 5px 14px; border-radius: 16px; font: 600 13px Inter; color: #fff; background: rgba(255,255,255,.22); backdrop-filter: blur(14px); display: flex; gap: 6px; align-items: center; }

  /* App chrome */
  .appbg { position: absolute; inset: 0; background: var(--bg); }
  .navbar { position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 30; }
  .navtitle { position: absolute; left: 0; right: 0; text-align: center; font: 600 17px Inter; letter-spacing: -0.41px; }
  .back { display: flex; align-items: center; gap: 2px; color: var(--tint); font: 400 17px Inter; letter-spacing: -0.41px; }
  .content { position: absolute; left: 0; right: 0; top: 98px; bottom: 0; }
  .largeTitle { font: 800 34px/41px Inter; letter-spacing: 0.37px; }
  .subtitle { font: 400 15px/20px Inter; color: var(--ink2); margin-top: 2px; }
  .eyebrow { font: 600 13px/18px Inter; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink2); }
  .title2 { font: 700 22px/28px Inter; letter-spacing: 0.35px; }
  .title3 { font: 600 20px/25px Inter; letter-spacing: 0.38px; }
  .headline { font: 600 17px/22px Inter; letter-spacing: -0.41px; }
  .body { font: 400 17px/22px Inter; letter-spacing: -0.41px; }
  .callout { font: 400 16px/21px Inter; letter-spacing: -0.32px; }
  .subhead { font: 400 15px/20px Inter; letter-spacing: -0.24px; }
  .foot { font: 400 13px/18px Inter; letter-spacing: -0.08px; color: var(--ink2); }
  .cap1 { font: 400 12px/16px Inter; }
  .card { background: var(--surface); border-radius: 22px; box-shadow: 0 1px 2px rgba(40,20,50,.06), 0 6px 18px rgba(40,20,50,.07); }
  .pills { display: flex; gap: 8px; }
  .pill { padding: 0 16px; height: 36px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font: 600 15px Inter; letter-spacing: -0.24px; background: var(--fill); color: var(--ink); white-space: nowrap; }
  .pill.on { background: var(--ink); color: #fff; }
  .pill.soft { background: var(--tintSoft); color: var(--onTintSoft); }
  .cta { height: 52px; border-radius: 26px; background: var(--tint); color: #fff; font: 600 17px Inter; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: -0.41px; }
  .searchField { height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--ink3); box-shadow: 0 1px 2px rgba(40,20,50,.05); }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: rgba(250,248,252,.96); backdrop-filter: blur(20px); border-top: 0.5px solid var(--separator); display: flex; justify-content: space-around; padding: 8px 14px 0; z-index: 30; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 500 10.5px Inter; color: var(--ink3); width: 84px; }
  .tab .bub { width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .tab.on { color: var(--tint); }
  .tab.on .bub { background: var(--tintSoft); }
  .seg { display: flex; background: var(--fill); border-radius: 18px; padding: 3px; }
  .seg div { flex: 1; text-align: center; height: 32px; line-height: 32px; border-radius: 15px; font: 600 14px Inter; color: var(--ink2); }
  .seg div.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(40,20,50,.12); }
  .glassbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px; background: rgba(250,248,252,.96); backdrop-filter: blur(20px); border-top: 0.5px solid var(--separator); z-index: 30; }
  .num { width: 30px; height: 30px; border-radius: 15px; background: var(--fill); color: var(--ink2); display: flex; align-items: center; justify-content: center; font: 700 15px Inter; flex: none; }
  .num.cur { background: var(--tint); color: #fff; }
  .lic { stroke-linecap: round; stroke-linejoin: round; fill: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>

// Generic app labels only (never a brand): the glyph each one gets.
const APPS = {
  Mail: 'mail', Photos: 'image', Music: 'music', Notes: 'file-text', Weather: 'cloud', Camera: 'camera',
  Calendar: 'calendar', Clock: 'clock', Maps: 'map', Messages: 'message-circle', Phone: 'phone', Settings: 'sliders',
  Browser: 'compass', Books: 'book-open', Shop: 'shopping-bag', Health: 'heart', Videos: 'video', Podcasts: 'headphones',
  Reminders: 'check-square', Wallet: 'credit-card', Fitness: 'activity', Games: 'game-controller', Pets: 'paw', Food: 'pizza',
};

const D = () => window.DATA;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function chrome(name, size, colour, sw = 2) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" class="lic" stroke="${colour}" stroke-width="${sw}">${FEATHER[name] || ''}</svg>`;
}
function glyphMarkup(name, colour) {
  if (FEATHER[name]) return `<g class="lic" stroke="${colour}" stroke-width="2">${FEATHER[name]}</g>`;
  const g = D().inhouse[name];
  if (!g) return '';
  const strokes = g.strokes.map((d) => `<path d="${d}"/>`).join('');
  const dots = (g.dots || []).map((d) => `<path d="${d}" fill="${colour}" stroke="none"/>`).join('');
  return `<g class="lic" stroke="${colour}" stroke-width="2">${strokes}</g>${dots}`;

// Seeded random (mulberry32), so a theme's texture is the same every render.
function rng(seed) {

let uid = 0;
/**
 * One icon as IconCanvas draws it, in a 100-unit box: shape path from src/core/shapes.ts, background
 * (gradient from iconLook.themedTextureSpec, or a solid studio colour), texture marks (stars / grain),
 * glyph centred at glyphScale.

function iconSvg(spec, glyph, size, seedStr) {

    const v = spec.bg.vec;
    defs += `<linearGradient id="${id}g" x1="${v.x1}" y1="${v.y1}" x2="${v.x2}" y2="${v.y2}"><stop offset="0" stop-color="${spec.bg.from}"/><stop offset="1" stop-color="${spec.bg.to}"/></linearGradient>`;
    fill = `url(#${id}g)`;
  } else fill = spec.bg.colour;
  let marks = '';
  if (spec.texture && spec.texture !== 'none') {
    let s = 0; for (const ch of seedStr) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
    const r = rng(s ^ (spec.seed || 0));
    if (spec.texture === 'stars') {
      for (let i = 0; i < 16; i++) { const rad = 0.5 + r() * 1.4; marks += `<circle cx="${(r() * 100).toFixed(1)}" cy="${(r() * 100).toFixed(1)}" r="${rad.toFixed(2)}" fill="${spec.mark}" opacity="${(0.35 + r() * 0.5).toFixed(2)}"/>`; }
    } else {
      for (let i = 0; i < 90; i++) marks += `<circle cx="${(r() * 100).toFixed(1)}" cy="${(r() * 100).toFixed(1)}" r="${(0.35 + r() * 0.5).toFixed(2)}" fill="${spec.mark}" opacity="${(0.08 + r() * 0.14).toFixed(2)}"/>`;
    }

    `<g clip-path="url(#${id}c)"><path d="${path}" fill="${fill}"/>${marks}<rect width="100" height="60" fill="#fff" opacity=".06"/></g>` +
    `<g transform="translate(${off} ${off}) scale(${k})">${glyphMarkup(glyph, spec.glyph)}</g></svg>`;
}

    `<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="${c}" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2.4" fill="${c}"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="${c}" fill-opacity=".45"/></svg></span></div>`;
}
// A widget: the theme's widget art over the wallpaper behind it (T251: no blur), like ThemeWidgetArt.
function widget(theme, size, x, y, inner = '') {
  const dims = { small: [170, 170], medium: [364, 170], large: [364, 382] }[size];
  const art = theme.widgets && theme.widgets[size];
  const bgPos = `background-image:url('${theme.wall}');background-size:440px 956px;background-position:${-x}px ${-y}px;`;
  return `<div class="widget" style="left:${x}px;top:${y}px;width:${dims[0]}px;height:${dims[1]}px;${theme.wall ? bgPos : `background:${theme.palette.tile}`}">` +

window.renderShot = function renderShot() {
  const d = D();
  const shot = d.shot;
  const scale = d.size.width / 1320;
  const stageH = d.size.height / scale;
  const t = shot.theme ? d.themes[shot.theme] : null;
  const screens = { home: screenHome, widgets: screenWidgets, themes: screenThemes, theme: screenTheme, install: screenInstall, studio: screenStudio };
  const title = shot.title.replace('{themeCount}', String(d.themeCount));
  const long = title.length > 34;
  const stage = document.getElementById('stage');
  stage.style.height = stageH + 'px';
  stage.style.transform = `scale(${scale})`;
  stage.style.background = `linear-gradient(170deg, ${shot.bg[0]}, ${shot.bg[1]})`;
  const accentInline = shot.accent && shot.accent.length < 8;
  stage.innerHTML =
    `<div class="caption"><h1 class="${long ? 'long' : ''}">${esc(title)}${accentInline ? ` <span class="accent">${esc(shot.accent)}</span>` : ''}</h1>` +
    (shot.accent && !accentInline ? `<p class="accent">${esc(shot.accent)}</p>` : '') + `</div>` +
    `<div class="phone"><div class="screenwrap"><div class="screen">${screens[shot.screen](t)}</div></div></div>`;
  return { stageH };
};
