# A: a search for "indigo" (Indigo Current is the first of the matches).
- tapOn:
    text: "Search themes.*"
    optional: true
- inputText: "indigo"
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 03-themes-search-indigo
- tapOn:
    text: "Search themes.*"
    optional: true
- eraseText:
    charactersToErase: 10
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
# B: the Ocean & Water rail of big cards, moved one card along so Indigo Current leads.
- scrollUntilVisible:
