# Shot 6 candidates: Indigo Current leading the Themes tab, three ways (Ocean & Water chip grid, a search, the rail).
appId: ${APP_ID}
---
# A: the Ocean & Water chip opens that category's grid (Curlfin Cove, Indigo Current, ...).
- openLink: glaze://themes
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element:
      text: "Ocean & Water"
    direction: RIGHT
    timeout: 20000
    optional: true
- tapOn:
    text: "Ocean & Water"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03-themes-ocean-grid
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 04-themes-ocean-grid-scrolled
# B: a search for "indigo" (the field's accessibility label is "Search themes").
- tapOn:
    text: "Ocean & Water"
    optional: true
- openLink: glaze://themes
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "Search themes"
    optional: true
- inputText: "indigo"
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 05-themes-search-indigo
- eraseText:
    charactersToErase: 6
    optional: true
- inputText: "ocean"
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 06-themes-search-ocean
