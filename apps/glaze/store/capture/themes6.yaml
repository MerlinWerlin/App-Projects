# Shot 6 candidates: the Themes tab with Indigo Current leading the Ocean & Water rail, and a search for it.
appId: ${APP_ID}
---
- openLink: glaze://themes
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "Curlfin Cove"
    direction: DOWN
    timeout: 30000
    centerElement: true
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 03-themes-ocean
- swipe:
    from:
      text: "Curlfin Cove"
    direction: LEFT
    duration: 2500
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 04-themes-ocean-indigo
- swipe:
    from:
      text: "Indigo Current"
    direction: RIGHT
    duration: 3000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 05-themes-ocean-indigo-b
# Search: Indigo Current first among the matches.
- openLink: glaze://themes
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "Search themes, colours, moods"
    optional: true
- inputText: "indigo"
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 06-themes-search-indigo
