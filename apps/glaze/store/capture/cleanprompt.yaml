# "Use this theme?" without a tip banner behind it: close the prompt, clear the tips, open it again from the bar.
appId: ${APP_ID}
---
- openLink: glaze://theme/${THEME}
- runFlow:
    file: dismiss.yaml
- extendedWaitUntil:
    visible: "Not now"
    timeout: 30000
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Got it"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Got it"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Use this theme\?"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Yes, use it"
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 15-${THEME}-prompt-clean
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
