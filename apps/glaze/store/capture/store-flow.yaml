# App Store captures for Glaze 1.0.41 (Maestro, iOS simulator). Run by .github/workflows/glaze-store-capture.yml.
# Every step that depends on a tap is optional, so one miss never loses the other screens.
# Free themes (src/core/freeThemes.ts) are used for "Use this theme?", Artwork 1-5 and Custom 1-5; premium themes are
# shown on their theme pages, and one opens the yearly Glaze Plus sheet.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    file: dismiss.yaml

# Themes tab, top of the page (the Free section, Alpine Starlight and Cloud Atelier first).
- openLink: glaze://themes
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-themes
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 02-themes-scrolled

# Premium themes' pages first (browsing is free): their "Got it" taps use up the rotating tips, so the
# "Use this theme?" captures below have no tip banner behind them.
- runFlow:
    file: page.yaml
    env:
      THEME: desert-afterglow
- runFlow:
    file: page.yaml
    env:
      THEME: porcelain-tide
- runFlow:
    file: page.yaml
    env:
      THEME: lavender-nocturne
- runFlow:
    file: indigo.yaml
    env:
      THEME: indigo-current

# Free themes: prompt, Yes, next steps, the Widgets tab with their art, the plain page.
- runFlow:
    file: theme.yaml
    env:
      THEME: cobalt-caravan
- runFlow:
    file: custom.yaml
    env:
      ART: '3'
      POINT: '91%,72%'
      SLOT: '1'
      SHOOT: 'menu'
- runFlow:
    file: custom.yaml
    env:
      ART: '1'
      POINT: '91%,40%'
      SLOT: '4'
      SHOOT: ''
- runFlow:
    file: theme.yaml
    env:
      THEME: cloud-atelier
- runFlow:
    file: custom.yaml
    env:
      ART: '1'
      POINT: '91%,40%'
      SLOT: '2'
      SHOOT: ''
- runFlow:
    file: custom.yaml
    env:
      ART: '2'
      POINT: '91%,56%'
      SLOT: '5'
      SHOOT: ''

# The yearly Glaze Plus sheet, from "Use this theme?" on a premium theme.
- runFlow:
    file: plus.yaml
    env:
      THEME: lavender-nocturne

# Alpine Starlight (the hero) last, so the Widgets and icons screens below are in it.
- runFlow:
    file: theme.yaml
    env:
      THEME: alpine-starlight
- runFlow:
    file: custom.yaml
    env:
      ART: '3'
      POINT: '91%,72%'
      SLOT: '3'
      SHOOT: ''

# Widgets tab with the in-use theme, then the Custom slots.
- openLink: glaze://widgets
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 30-widgets
- scrollUntilVisible:
    element:
      text: "Your artwork"
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 31-widgets-custom
# "Your artwork" from the middle to near the top, so Custom 1-5 fill the screen.
- swipe:
    start: "50%,78%"
    end: "50%,34%"
    duration: 900
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 32-widgets-custom-top

# Icons step for the in-use theme, and the install screen.
- openLink: glaze://theme/alpine-starlight?step=icons
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 40-icons-step
- openLink: glaze://install?theme=alpine-starlight
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 41-install
