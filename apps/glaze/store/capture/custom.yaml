# Puts the in-use theme's Artwork ${ART} on Custom ${SLOT} through the artwork's own menu (Widgets tab).
appId: ${APP_ID}
---
- openLink: glaze://widgets
- waitForAnimationToEnd:
    timeout: 6000
# The row is one accessibility element ("Artwork N"); its "..." button is hidden from accessibility, so it is
# tapped by position (measured on the 1320 x 2868 capture: x 91%, rows at 40 / 56 / 72 %; Maestro takes whole percentages only).
- extendedWaitUntil:
    visible: "Artwork ${ART}"
    timeout: 60000
    optional: true
- tapOn:
    point: ${POINT}
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      true: ${SHOOT == 'menu'}
    commands:
      - takeScreenshot: 20-artwork-menu
- tapOn:
    text: "Add to Custom ${SLOT}"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Replace"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
