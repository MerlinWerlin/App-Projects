# Shot 8 candidates: a theme's Wallpaper screen, which opens on the Lock Screen preview.
appId: ${APP_ID}
---
- openLink: glaze://themes
- waitForAnimationToEnd:
    timeout: 3000
- openLink: glaze://theme/${THEME}?step=wallpaper
- runFlow:
    file: dismiss.yaml
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "Got it"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 16-${THEME}-lock
- tapOn:
    text: "Home Screen"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 17-${THEME}-wall-home
- tapOn:
    text: "Lock Screen"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 18-${THEME}-lock-scrolled
