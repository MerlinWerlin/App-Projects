# A theme's page only (no "Use this theme?"): close the prompt with Not now, clear the tip, capture.
appId: ${APP_ID}
---
- openLink: glaze://theme/${THEME}
- runFlow:
    file: dismiss.yaml
- extendedWaitUntil:
    visible: "Not now"
    timeout: 30000
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "Got it"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 13-${THEME}-page
