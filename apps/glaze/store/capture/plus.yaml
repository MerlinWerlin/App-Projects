# The yearly Glaze Plus sheet: "Use this theme?" on a premium theme, then Yes.
appId: ${APP_ID}
---
- openLink: glaze://theme/${THEME}
- runFlow:
    file: dismiss.yaml
- extendedWaitUntil:
    visible: "Yes, use it"
    timeout: 30000
    optional: true
- tapOn:
    text: "Yes, use it"
    optional: true
- extendedWaitUntil:
    visible: ".*(a year|Subscribe).*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 50-plus
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 51-plus-scrolled
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
