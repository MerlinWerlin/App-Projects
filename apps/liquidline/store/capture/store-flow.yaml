# App Store captures for Liquidline 1.0.0 (Maestro, iOS simulator), run by .github/workflows/liquidline-store-capture.yml
# on the capture build (EXPO_PUBLIC_LIQUIDLINE_CAPTURE=1: every tool open, as during the trial). ${MODE} = light/dark.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "country-AU"
- waitForAnimationToEnd
- takeScreenshot: 06-country-${MODE}
- tapOn:
    id: "onboarding-next"
- waitForAnimationToEnd
- tapOn:
    id: "onboarding-agree"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-pt-${MODE}

- tapOn:
    id: "refrigerant-button"
- waitForAnimationToEnd
- tapOn:
    id: "pick-R407C"
- waitForAnimationToEnd
- tapOn:
    id: "pt-pressure"
- eraseText: 10
- inputText: "450"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: 03-glide-${MODE}

- tapOn:
    id: "refrigerant-button"
- waitForAnimationToEnd
- tapOn:
    id: "pick-R32"
- waitForAnimationToEnd
- openLink: liquidline://charge
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "sh-result"
    direction: DOWN
    optional: true
- scroll:
    optional: true
- takeScreenshot: 02-superheat-${MODE}

- openLink: liquidline://charge
- tapOn:
    text: "Extra charge"
- waitForAnimationToEnd
- tapOn:
    id: "extra-length"
- eraseText: 10
- inputText: "22"
- hideKeyboard
- scroll:
    optional: true
- takeScreenshot: 04-extra-${MODE}

- openLink: liquidline://evac
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 05-evac-${MODE}

- openLink: liquidline://tools
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 07-tools-${MODE}

- openLink: liquidline://chart
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 08-chart-${MODE}
