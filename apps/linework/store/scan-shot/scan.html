<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1320px;height:2868px;overflow:hidden}
  body{background:linear-gradient(180deg,#FFF4E4 0%,#FFE1CC 55%,#F9CDB8 100%);position:relative;font-family:Inter,Arial,sans-serif}
  .blob{position:absolute;border-radius:50%;background:#FFFFFF;opacity:.28}
  h1{position:absolute;top:150px;left:0;right:0;margin:0;text-align:center;font:700 128px/1.04 Fraunces,Georgia,serif;color:#22201C;letter-spacing:-1px}
  .sub{position:absolute;top:452px;left:0;right:0;text-align:center;font:500 50px/1.3 Inter,Arial,sans-serif;color:#6E675D}
  /* desk + paper */
  .desk{position:absolute;left:0;right:0;top:2010px;bottom:0;background:linear-gradient(180deg,#E9CDB0 0%,#DDB994 100%)}
  .scene{position:absolute;left:0;top:0;width:1320px;height:2868px;perspective:2600px;perspective-origin:660px 900px}
  .paper{position:absolute;left:190px;top:1560px;width:940px;height:1240px;background:#FBF8F2;
         transform-origin:50% 100%;transform:rotateX(62deg);box-shadow:0 30px 60px rgba(34,32,28,.22);border-radius:6px}
  .paper svg{position:absolute;left:170px;top:250px;width:600px;height:600px}
  .phoneShadow{position:absolute;left:300px;top:1730px;width:720px;height:230px;border-radius:50%;
         background:radial-gradient(closest-side,rgba(34,32,28,.30),rgba(34,32,28,0));filter:blur(6px)}
  .beam{position:absolute;left:0;top:0;width:1320px;height:2868px}
  .phone{position:absolute;left:330px;top:560px;width:660px;height:1430px;border-radius:104px;
         background:linear-gradient(135deg,#3A3833,#1D1C19 50%,#2E2C28);padding:22px;box-sizing:border-box;
         transform-origin:50% 100%;transform:rotateX(16deg) rotateZ(-4deg);box-shadow:0 60px 90px rgba(34,32,28,.30)}
  .screen{width:100%;height:100%;border-radius:84px;overflow:hidden;background:#E7DFD0}
  .screen img{width:100%;height:100%;object-fit:cover;display:block}
  .gap{position:absolute;right:120px;top:1370px;width:250px;text-align:center;font:600 40px/1.2 Inter,Arial,sans-serif;color:#2346A8}
  .gap svg{display:block;margin:0 auto 10px}
  .spark{position:absolute;color:#2346A8;font-size:70px}
</style></head>
<body>
  <div class="blob" style="width:900px;height:900px;left:-380px;top:1250px"></div>
  <div class="blob" style="width:760px;height:760px;right:-300px;top:380px"></div>
  <h1>Hold it over<br>the paper</h1>
  <div class="sub">Follow the lines on screen with your pencil</div>
  <div class="desk"></div>
  <div class="scene">
    <div class="paper">
      <svg viewBox="0 0 400 400">
        <defs><clipPath id="drawn"><rect x="0" y="175" width="400" height="225"/></clipPath></defs>
        <g fill="none" stroke="#2346A8" stroke-opacity=".22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" id="roseGhost">ROSE</g>
        <g clip-path="url(#drawn)" fill="none" stroke="#3A3630" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">ROSE</g>
      </svg>
      <!-- pencil lying on the paper, tip on the line it is drawing -->
      <svg style="left:520px;top:560px;width:420px;height:420px;overflow:visible" viewBox="0 0 420 420">
        <g transform="translate(20,20) rotate(-38 0 0)">
          <rect x="0" y="-26" width="380" height="52" rx="6" fill="#F2B33D"/>
          <rect x="0" y="-26" width="380" height="17" fill="#F8CB66"/>
          <rect x="0" y="9" width="380" height="17" fill="#D9932A"/>
          <rect x="350" y="-26" width="44" height="52" fill="#C9C3B8"/>
          <rect x="394" y="-26" width="30" height="52" rx="10" fill="#E98A86"/>
          <polygon points="0,-26 0,26 -78,0" fill="#E9C9A0"/>
          <polygon points="-52,-9 -52,9 -78,0" fill="#3A3630"/>
        </g>
      </svg>
    </div>
    <div class="phoneShadow"></div>
    <div class="phone"><div class="screen"><img src="screen.png"></div></div>
  </div>
  <div class="gap">
    <svg width="120" height="230" viewBox="0 0 120 230"><path d="M60 10 V220 M30 40 L60 10 L90 40 M30 190 L60 220 L90 190" fill="none" stroke="#2346A8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/></svg>
    a hand's width<br>above the page
  </div>
  <div class="spark" style="left:90px;top:660px">✦</div>
  <div class="spark" style="right:110px;top:820px;font-size:54px">✦</div>
</body></html>
