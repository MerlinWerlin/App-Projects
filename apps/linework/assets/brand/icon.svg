<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Linework brand art, original to this repo: one continuous ink line that loops once and ends at a pencil tip. Tokens from docs/DESIGN_V2.md: paper #F7F3EE, line #E7E0D6, ink #3B5BDB (dark #91A7FF), graphite #1F1D1A, sunny #FFC94D, bubblegum #FF7AA2. App icon: full bleed paper, square corners (iOS applies its own mask). Faint paper rules under the motif. -->
  <rect width="1024" height="1024" fill="#F7F3EE"/>
  <g stroke="#E7E0D6" stroke-width="6">
    <line x1="0" y1="700" x2="1024" y2="700"/>
    <line x1="0" y1="812" x2="1024" y2="812"/>
  </g>
<g id="motif" transform="translate(48 88.8) scale(0.8)">
    <!-- the line: starts on the baseline, rises, makes one loop, runs into the pencil -->
    <path d="M 214 760
             C 300 760, 400 700, 470 600
             C 540 500, 560 330, 470 300
             C 380 270, 340 420, 430 520
             C 500 598, 600 600, 662 556"
          fill="none" stroke="#3B5BDB" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pencil, tip at the end of the line, body angled up and to the right -->
    <g transform="translate(662 556) rotate(-38)">
      <path d="M 0 0 L 96 -40 L 96 40 Z" fill="#F1D9B5"/>
      <path d="M 0 0 L 34 -14 L 34 14 Z" fill="#1F1D1A"/>
      <rect x="96" y="-40" width="196" height="80" fill="#FFC94D"/>
      <rect x="96" y="-40" width="196" height="26" fill="#FFD978"/>
      <rect x="292" y="-40" width="34" height="80" fill="#B9B2A8"/>
      <path d="M 326 -40 L 350 -40 Q 376 -40 376 -14 L 376 14 Q 376 40 350 40 L 326 40 Z" fill="#FF7AA2"/>
    </g>
  </g>
</svg>
