# Wattle App Store captures and a functional pass on the iOS simulator (Maestro).
# Run by .github/workflows/wattle-store-capture.yml with a capture build (EXPO_PUBLIC_WATTLE_CAPTURE=1:
# every calculator open, example inputs pre-filled). Deep links plus optional taps, so one miss never loses the rest.
# ${MODE} is light or dark (file-name suffix).
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    stopApp: true
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: "Bend"
- takeScreenshot: 01-bend-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-bend-result-${MODE}
- scroll:
    optional: true
- takeScreenshot: 02b-bend-result-more-${MODE}

- scrollUntilVisible:
    element:
      text: "3-pt saddle"
    direction: UP
    optional: true
- tapOn:
    text: "3-pt saddle"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-saddle-${MODE}
- scroll:
    optional: true
- takeScreenshot: 03b-saddle-result-${MODE}

- openLink: wattle://drop
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 04-drop-${MODE}
- scroll:
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-drop-result-${MODE}
- tapOn:
    text: "Show the working"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05b-drop-working-${MODE}

- openLink: wattle://fill
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 06-fill-${MODE}
- scroll:
    optional: true
- takeScreenshot: 07-fill-result-${MODE}

- openLink: wattle://power
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 08-ohm-${MODE}
- tapOn:
    text: ".*3φ power.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-power-${MODE}
- scroll:
    optional: true
- takeScreenshot: 09b-power-result-${MODE}

- openLink: wattle://runs
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 10-runs-${MODE}
- scroll:
    optional: true
- scroll:
    optional: true
- takeScreenshot: 11-runs-result-${MODE}
- scroll:
    optional: true
- takeScreenshot: 11b-runs-result-more-${MODE}

- openLink: wattle://convert
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 12-convert-${MODE}

- openLink: wattle://tools
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 13-tools-${MODE}

- openLink: wattle://about
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 14-about-${MODE}

- openLink: wattle://unlock
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 15-unlock-${MODE}
