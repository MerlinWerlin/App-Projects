# Rootpass store and review captures (simulator, capture build: everything unlocked, nothing bought).
appId: ${APP_ID}
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Where do you work?"
    timeout: 30000
- tapOn: "Australia.*"
- waitForAnimationToEnd
- takeScreenshot: 01-welcome
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "ROOTPASS"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 02-home-tools
- scroll
- takeScreenshot: 02b-home-scrolled
- openLink: rootpass://tool/saddle?header=114.3&branch=88.9&angle=60&wall=5.5
- extendedWaitUntil:
    visible: "Saddle cut"
    timeout: 15000
- takeScreenshot: 03-saddle-inputs
- scrollUntilVisible:
    element: "Print true-scale template"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 04-saddle-result
- tapOn: "Show the working"
- scrollUntilVisible:
    element: "Hide the working"
    direction: DOWN
    centerElement: true
- takeScreenshot: 05-saddle-working
- scrollUntilVisible:
    element: "Cut back"
    direction: DOWN
    centerElement: true
- takeScreenshot: 06-saddle-ordinates
- openLink: rootpass://tool/lobster?od=168.3&bend=90&pieces=5&radius=252.5
- extendedWaitUntil:
    visible: "Lobster-back"
    timeout: 15000
- scrollUntilVisible:
    element: "Cut each face.*"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 07-lobster
- openLink: rootpass://tool/cutlist
- extendedWaitUntil:
    visible: "Cut list"
    timeout: 15000
- scrollUntilVisible:
    element: "Stock lengths.*"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 08-cutlist
- openLink: rootpass://tool/weight
- extendedWaitUntil:
    visible: "Steel weight"
    timeout: 15000
- takeScreenshot: 09-weight-top
- scrollUntilVisible:
    element: "Total.*"
    direction: DOWN
    centerElement: true
- takeScreenshot: 10-weight
- openLink: rootpass://tool/pcd
- extendedWaitUntil:
    visible: "Bolt circle"
    timeout: 15000
- scrollUntilVisible:
    element: "Hole to hole.*"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 11-pcd
- openLink: rootpass://tool/frame?kind=polygon
- extendedWaitUntil:
    visible: "Frame mi(tres|ters)"
    timeout: 15000
- scrollUntilVisible:
    element: "Mi(tre|ter) both ends.*"
    direction: DOWN
    centerElement: true
- takeScreenshot: 12-frame
- openLink: rootpass://tool/weld
- extendedWaitUntil:
    visible: "Weld metal"
    timeout: 15000
- scrollUntilVisible:
    element: "Filler to buy.*"
    direction: DOWN
    centerElement: true
- takeScreenshot: 13-weld
- openLink: rootpass://tool/bend
- extendedWaitUntil:
    visible: "Sheet bending"
    timeout: 15000
- scrollUntilVisible:
    element: "Flat blank.*"
    direction: DOWN
    centerElement: true
- takeScreenshot: 14-bend
- openLink: rootpass://tool/cutlist?lockedPreview=1
- extendedWaitUntil:
    visible: "Cut list"
    timeout: 15000
- takeScreenshot: 14b-locked-preview
- openLink: rootpass://unlock
- waitForAnimationToEnd
- takeScreenshot: 15-unlock
- tapOn: "Close"
- openLink: rootpass://jobs
- waitForAnimationToEnd
- takeScreenshot: 16-jobs-empty
- openLink: rootpass://settings
- waitForAnimationToEnd
- takeScreenshot: 17-settings
