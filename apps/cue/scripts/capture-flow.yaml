appId: com.jared797.cue
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Scripts
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-library
- tapOn: 'Welcome to Cue.*'
- assertVisible: Prompt
- takeScreenshot: 02-editor
- tapOn: Prompt
- assertVisible: Steady
- takeScreenshot: 03-prompter
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Scripts
    timeout: 60000
- tapOn: Settings
- tapOn:
    text: Cue Plus
    index: 1
- assertVisible: One payment. Yours for good. No subscription.
- takeScreenshot: 04-plus
- scrollUntilVisible:
    element:
      text: Restore purchase
    direction: DOWN
    timeout: 20000
- takeScreenshot: 05-purchase-actions
