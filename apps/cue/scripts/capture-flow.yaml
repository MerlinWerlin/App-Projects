appId: com.jared797.cue
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Scripts
    timeout: 60000
- takeScreenshot: 01-library
- tapOn: 'Welcome to Cue.*'
- assertVisible: Prompt
- takeScreenshot: 02-editor
- tapOn: Prompt
- assertVisible: Steady
- takeScreenshot: 03-prompter
- openLink: cue://plus
- tapOn:
    text: Open
    optional: true
- assertVisible: Cue Plus
- takeScreenshot: 04-plus
- scrollUntilVisible:
    element:
      text: Restore purchase
    direction: DOWN
    timeout: 20000
- takeScreenshot: 05-purchase-actions
