# Simulator design capture (.github/workflows/couch-design-capture.yml): the lower half of the remote
# (rockers, number / keyboard / apps keys, playback, colour keys), scrolled into view.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
# The TV bar's text is part of its button label (VoiceOver), so wait for the intro and the demo TVs instead.
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "never-present"
    timeout: 9000
    optional: true
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: remote-lower-${MODE}
