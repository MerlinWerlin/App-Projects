<title>Couch Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column shaped like a handset remote; header shows the active TV, three tabs, sheets slide up from the bottom */
:root{
  --bg:#E4E8EC; --body:#F6F7F9; --key:#FFFFFF; --key-edge:#CDD3DA; --ink:#1C232B; --muted:#5D6873;
  --accent:#2F5BD3; --accent-soft:#E3EAFB; --power:#C43D3D; --ok:#2C7A54; --warn:#9B6A12;
  --shadow:0 1px 0 var(--key-edge), 0 2px 6px rgba(30,40,55,.08);
  --display:"Sora","Avenir Next","Segoe UI","Inter Display","Inter",sans-serif;
  --text:"Manrope","Helvetica Neue","Inter",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* fb-1017b H2 key face (src/ui/icons/keyFaceColors.ts): top lit 7% toward white, bottom 5% toward keyEdge,
     white gloss fading out by 18%, keyEdge inner shade from 78%. applyTheme() sets these per remote theme. */
  --kf-top:color-mix(in srgb,var(--key) 93%,#fff); --kf-bot:color-mix(in srgb,var(--key) 95%,var(--key-edge));
  --kf-gloss:rgba(255,255,255,.6); --kf-shade:color-mix(in srgb,var(--key-edge) 18%,transparent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --body:#171B21; --key:#222831; --key-edge:#0A0C0F; --ink:#E6EAEF; --muted:#98A3AF;
  --accent:#86A6FF; --accent-soft:#1E2A47; --power:#FF7A72; --ok:#6CC796; --warn:#E5B35A;
  --shadow:0 1px 0 var(--key-edge), 0 2px 8px rgba(0,0,0,.35); color-scheme:dark;
  --kf-gloss:rgba(255,255,255,.14); --kf-shade:color-mix(in srgb,var(--key-edge) 35%,transparent)}}
:root[data-theme="dark"]{
  --bg:#0E1115; --body:#171B21; --key:#222831; --key-edge:#0A0C0F; --ink:#E6EAEF; --muted:#98A3AF;
  --accent:#86A6FF; --accent-soft:#1E2A47; --power:#FF7A72; --ok:#6CC796; --warn:#E5B35A;
  --shadow:0 1px 0 var(--key-edge), 0 2px 8px rgba(0,0,0,.35); color-scheme:dark;

*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:420px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tvbar{display:flex;align-items:center;gap:10px;background:var(--body);border-radius:16px;padding:10px 12px;border:0;width:100%;text-align:left}
.led{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent);flex:none}
.led.off{background:var(--muted);box-shadow:none}
.tvbar .nm{font-family:var(--display);font-weight:600;font-size:16px}
.tvbar .sub{font-size:12.5px;color:var(--muted)}
.tvbar .ms{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--body);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;border-radius:9px;padding:9px 0;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--key);color:var(--ink);box-shadow:var(--shadow)}
.remote{background:var(--body);border-radius:28px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.key{background:var(--key);border:0;border-radius:var(--radius,14px);box-shadow:var(--shadow);min-height:48px;min-width:48px;display:grid;place-items:center;font-weight:600;font-size:13px;transition:transform .08s}

/* fb-1017b H2: every icon is an inline SVG from the app's own path data (#icon-paths, src/ui/icons/paths.ts):
   24 viewBox, stroke 1.9, round caps and joins, filled parts solid; colour is currentColor from the theme. */
svg.ic{flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg.ic .f{fill:currentColor;stroke:none}
/* physical key face (KeyFace.tsx): gradient face, thin top highlight, soft inner shade at the bottom */
.key,.rocker,.x{background:linear-gradient(180deg,var(--kf-gloss) 0,transparent 18%),linear-gradient(180deg,transparent 78%,var(--kf-shade) 100%),linear-gradient(180deg,var(--kf-top),var(--kf-bot))}

.key.round{border-radius:50%}
.key.wide{flex:1}
/* fb-1017-ok / fb-1017b H1: one size variable (--pad) drives ring, OK key and arrow areas (src/core/dpadGeometry.ts).

   white light fading out by 36%, keyEdge shade from 64%, soft keyEdge drop shadow. */

.pad .l,.pad .r{top:calc(var(--pad)*.24);height:calc(var(--pad)*.52);width:calc(var(--pad)*.24)}.pad .l{left:0}.pad .r{right:0}
.pad button.hit{color:var(--accent)}
.pad .okb{top:50%;left:50%;width:calc(var(--pad)*.52);height:calc(var(--pad)*.52);transform:translate(-50%,-50%);transform-origin:50% 50%;border-radius:50%;padding:0;background:var(--accent);color:var(--accent-ink,#fff);font-family:var(--display);font-weight:700;font-size:calc(var(--pad)*.081);line-height:1;box-shadow:inset 0 0 0 calc(var(--pad)*.031) var(--accent-soft),0 3px 6px color-mix(in srgb,var(--key-edge) 45%,transparent);background-image:linear-gradient(180deg,rgba(255,255,255,.3) 0,rgba(255,255,255,0) 36%,transparent 64%,color-mix(in srgb,var(--key-edge) 35%,transparent) 100%);transition:transform .12s}
.pad .okb.hit{filter:brightness(1.15);transform:translate(-50%,-50%) scale(.94)}
.touch{width:100%;aspect-ratio:1.25;border-radius:22px;background:var(--key);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);font-size:13px;touch-action:none;user-select:none;position:relative;overflow:hidden}
.touch .dot{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);pointer-events:none;transform:translate(-50%,-50%)}
.rocker{display:flex;flex-direction:column;background:var(--key);border-radius:24px;box-shadow:var(--shadow);width:60px;align-items:center}
.rocker button{border:0;background:none;height:52px;width:60px;display:grid;place-items:center;border-radius:24px}
.rocker button.hit{background:var(--accent-soft)}
.rocker span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rocker svg{width:20px;height:20px}
.mid{display:grid;grid-template-columns:repeat(2,52px);gap:10px}
.log{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;min-height:18px}
.log b{color:var(--ink);font-weight:500}
.seg{display:inline-flex;background:var(--key);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink,#fff)}
.promise{font-size:12.5px;color:var(--muted);text-align:center}
.simple .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.simple .key{min-height:84px;font-size:17px;border-radius:20px;flex-direction:column;gap:4px;display:flex;align-items:center;justify-content:center}
.simple .key svg{width:30px;height:30px}
/* lists */
h2{font-family:var(--display);font-size:17px;margin:0;text-wrap:balance}
.panel{background:var(--body);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* fb-1017b H3 app tiles (src/ui/apps/AppTile.tsx): 4:3 artwork edge to edge on top, name below. Demo apps carry

   Couch type on a palette gradient picked from the app id. No symbol or emoji glyphs, no service logos. */
.app{border:0;background:var(--key);border-radius:16px;box-shadow:var(--shadow);padding:0;display:flex;flex-direction:column;align-items:stretch;min-width:0;overflow:hidden;color:var(--ink)}
.app .art{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--body);container-type:inline-size}
.app .art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.app .wm{position:absolute;left:8px;right:8px;bottom:6px;color:#fff;font-family:var(--display);font-weight:700;font-size:13cqw;line-height:1.2;text-align:start;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.app .hl{position:absolute;inset:0;display:grid;place-items:center;padding:0 8px;color:#fff;font-family:var(--display);font-weight:700;line-height:1.12;text-align:center;white-space:pre-line;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.app .cap{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 8px 10px;min-width:0}
.app .nm{font-size:12.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app:active{background:var(--accent-soft)}
.tv{display:flex;align-items:center;gap:12px;background:var(--key);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}

.tv .t b{display:block}
.tv .t small{color:var(--muted);font-size:12.5px}
.chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.beta{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink,#fff);min-height:46px}
.btn.ghost{background:var(--key);color:var(--ink);box-shadow:var(--shadow)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setting small{display:block;color:var(--muted);font-size:12.5px}
.switch{width:50px;height:30px;border-radius:99px;border:0;background:var(--key-edge);position:relative;flex:none}

.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.diag{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.diag dt{color:var(--muted)} .diag dd{margin:0;text-align:right}

function mixHex(a,b,t){var x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);return '#'+[16,8,0].map(function(sh){var p=(x>>sh)&255,q=(y>>sh)&255;return ('0'+Math.round(p+(q-p)*t).toString(16)).slice(-2)}).join('').toUpperCase()}

 TVARS.forEach(function(v){st.removeProperty(v)});
 if(!t){r.removeAttribute('data-rtheme');r.removeAttribute('data-tex');return ''}

 var set={'--bg':t.bg,'--stage':t.stage,'--body':t.body,'--key':t.key,'--key-edge':t.keyEdge,'--ink':t.ink,'--muted':t.muted,'--accent':t.accent,'--accent-soft':t.accentSoft,'--accent-ink':t.accentInk,'--power':t.power,'--ring':t.ring,'--ring-lit':t.ringLit,'--ring-ink':t.ringInk||t.muted,'--glow':t.glow||'transparent','--radius':t.radius+'px','--tex-op':String(t.texture.opacity),'--t1':c[0]||t.body,'--t2':c[1]||c[0]||t.body,'--t3':c[2]||c[0]||t.body,

function send(key,label){
 var tv=cur();
 if(!tv.on && key!=='POWER'){toast(tv.name+' is off. Tap power to wake it.');return}
 if(key==='POWER'){tv.on=!tv.on;tv.ms=tv.on?(20+Math.round(Math.random()*30)):null;render();toast(tv.on?'Waking '+tv.name+' (Wake-on-LAN)':tv.name+' turned off');return}
 if(key==='VOL_UP')S.vol=Math.min(100,S.vol+1);
 if(key==='VOL_DOWN')S.vol=Math.max(0,S.vol-1);
 var ms=Math.max(9,Math.round((tv.ms||30)+(Math.random()*16-8)));tv.ms=ms;
 S.last={k:label||key,ms:ms};
 if(S.haptics&&navigator.vibrate){try{navigator.vibrate(8)}catch(e){}}
 var logEl=document.getElementById('log');if(logEl)logEl.innerHTML='<span>sent <b>'+esc(S.last.k)+'</b></span><span>'+ms+' ms · vol '+S.vol+'</span>';
 var m=document.getElementById('ms');if(m)m.textContent=ms+' ms';
}

var SOURCES=['TV','HDMI 1','HDMI 2','HDMI 3','HDMI 4','AV'];
function sourceSheet(){
 openSheet(hd('Source')+'<div class="srcs">'+SOURCES.map(function(s){return '<button class="key'+(s===S.source?' cur':'')+'" data-src="'+s+'">'+s+'</button>'}).join('')+'</div><p class="note">The list comes from your TV where it shares one. If not, Couch cycles through sources like the button on your TV remote.</p><button class="btn ghost" data-src="NEXT">Next source</button>','Source');
}
function numpadSheet(){
 var n='<div class="numpad">'+[1,2,3,4,5,6,7,8,9].map(function(d){return '<button class="key" data-num="'+d+'">'+d+'</button>'}).join('')+'<button class="key" data-num="-" aria-label="Dash">–</button><button class="key" data-num="0">0</button><button class="key" data-num="OK" aria-label="Enter">OK</button></div>';
 openSheet(hd('Channel number')+'<div class="mono" id="numshow" style="font-size:26px;text-align:center;min-height:36px">&nbsp;</div>'+n+'<p class="note">For free-to-air channels. Digits go straight to the TV.</p>','Number pad');
}
/* infrared: the app lists TV makers here; the prototype uses generic code groups so it names no brand */
var IRBRANDS=['Common TV codes','Older TVs','Projectors','Not sure'],IRTOTAL={'Common TV codes':6,'Older TVs':5,'Projectors':4,'Not sure':42},ir={brand:null,set:1,total:0};
function irSheet(){
 openSheet(hd('Set up with infrared')+'<div class="tip">Works on phones with an infrared blaster. Phones without one use Wi-Fi.</div><p>Which codes should Couch try?</p><div class="srcs">'+IRBRANDS.map(function(b){return '<button class="key" data-irbrand="'+b+'">'+b+'</button>'}).join('')+'</div>','Infrared setup');
}
function irTest(){
 openSheet(hd(esc(ir.brand)+' · find your code')+'<p>Point your phone at the TV and tap <b>Volume up</b>.</p><div class="irstep"><span class="num">'+ir.set+'</span><span class="t" style="flex:1"><b>Code '+ir.set+' of '+ir.total+'</b><br><small class="note">Each code is a different signal set TVs use.</small></span><button class="key" data-act="irsend" aria-label="Send volume up">'+ICON.volUp+'</button></div><p>Did the TV volume go up?</p><div class="split"><button class="btn ghost" data-act="irno">No, try next</button><button class="btn" data-act="iryes">Yes, it worked</button></div>','Find code');
}
function irSave(){
 openSheet(hd('Code '+ir.set+' works')+'<p class="note">Couch will use this code for every button on this TV.</p><label class="note" for="tvname">Name</label><input class="field" id="tvname" value="TV '+(S.tvs.length+1)+'"><button class="btn" data-act="irdone">Save TV</button>','Save TV');
}
function bindVoice(){
 var v=document.getElementById('voice');if(!v)return;
 v.addEventListener('pointerdown',function(){v.classList.add('on');v.querySelector('span').textContent='Listening… let go to send'});
 function up(){if(!v.classList.contains('on'))return;v.classList.remove('on');v.querySelector('span').textContent='Hold to talk';send('VOICE','voice: "find cooking shows"');toast('Sent to the TV assistant: "find cooking shows"')}
 v.addEventListener('pointerup',up);v.addEventListener('pointerleave',up);
}
function plusSheet(){openSheet(hd('Couch Plus')+'<p>One payment of <b>A$3.99</b>. No subscription, no renewals.</p><ul class="note" style="margin:0;padding-left:18px"><li>Home and Lock Screen widgets</li><li>Live volume on the Lock Screen</li><li>A remote on your watch</li><li>One-tap macros like "Movie night"</li></ul><p class="note">Power, keyboard, touchpad, apps and every TV stay free whether you buy this or not.</p><button class="btn" data-act="close">Not now</button>','Couch Plus')}

document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;render();return}
 if(b.dataset.mode){S.mode=b.dataset.mode;render();return}
 if(b.dataset.key){var kk=b.dataset.key;hit(b);
  if(kk==='KEYBOARD'){keyboardSheet();return}
  if(kk==='APPS'){S.tab='apps';render();return}
  if(kk==='SOURCE'){sourceSheet();return}
  if(kk==='NUMPAD'){numpadSheet();return}
  send(kk,b.getAttribute('aria-label'));return}
 if(b.dataset.src){var s=b.dataset.src;if(s==='NEXT'){s=SOURCES[(SOURCES.indexOf(S.source)+1)%SOURCES.length]}S.source=s;send('SOURCE','source '+s);closeSheet();render();toast('Source: '+s);return}
 if(b.dataset.num){hit(b);var d=b.dataset.num,sh=document.getElementById('numshow');if(d==='OK'){send('ENTER','channel '+sh.textContent.trim());closeSheet();return}sh.textContent=(sh.textContent.trim()+d).slice(-5);send('NUM_'+d,'digit '+d);return}
 if(b.dataset.irbrand){ir.brand=b.dataset.irbrand;ir.set=1;ir.total=IRTOTAL[ir.brand];irTest();return}
 if(b.id==='voice')return;
 if(b.dataset.launch){send('LAUNCH','open '+b.dataset.launch);toast('Opening '+b.dataset.launch);return}
 if(b.dataset.pick){S.cur=+b.dataset.pick;S.last=null;closeSheet();render();toast('Now controlling '+cur().name);return}
 if(b.dataset.pair){pairSheet(+b.dataset.pair);return}
 if(b.dataset.sw){S[b.dataset.sw]=!S[b.dataset.sw];render();return}
 if(b.dataset.rt){setTheme(S.rtheme===b.dataset.rt?'':b.dataset.rt);render();return}
 var a=b.dataset.act;
 if(a==='close')closeSheet();
 else if(a==='switch')switchSheet();
 else if(a==='add')addSheet();
 else if(a==='plus')plusSheet();
 else if(a==='kbsend'){var v=document.getElementById('kbd').value;send('ENTER','search "'+v+'"');closeSheet()}
 else if(a==='kbclear'){document.getElementById('kbd').value='';send('CLEAR','clear')}
 else if(a==='ir')irSheet();
 else if(a==='irsend'){hit(b);toast('Sent volume up with code '+ir.set)}
 else if(a==='irno'){if(ir.set>=ir.total){toast('Tried every '+ir.brand+' code. Try "Not sure" to test them all.');irSheet();return}ir.set++;irTest()}
 else if(a==='iryes')irSave();
 else if(a==='irdone'){var nm=(document.getElementById('tvname').value||'TV').trim(),id=Date.now();S.tvs.push({id:id,name:nm,model:ir.brand+' · infrared code '+ir.set,plat:'Infrared',on:true,ms:5});S.cur=id;S.tab='remote';S.last=null;closeSheet();render();toast(nm+' added')}
 else if(a==='manual'){openSheet(hd('Enter IP address')+'<input class="field mono" id="ip" inputmode="decimal" placeholder="192.168.1.40"><p class="note">Find it on the TV under Settings › Network › Status.</p><button class="btn" data-act="ipgo">Connect</button>','Enter IP')}
 else if(a==='ipgo'){var ip=document.getElementById('ip').value.trim();if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)){toast('Enter an address like 192.168.1.40');return}closeSheet();toast('Checking '+ip+'… (demo)')}
 else if(a==='paired'){var f=found[+b.dataset.i],nm=(document.getElementById('tvname').value||f.model).trim(),id=Date.now();S.tvs.push({id:id,name:nm,model:f.model,plat:f.plat,on:true,ms:30});S.cur=id;S.tab='remote';S.last=null;closeSheet();render();toast(nm+' added')}
 else if(a==='copydiag'){var tv=cur(),txt='Couch connection report\nTV: '+tv.name+' ('+tv.model+', '+tv.plat+')\nStatus: '+(tv.on?'connected':'off')+'\nLast key: '+(S.last?S.last.k+' '+S.last.ms+' ms':'none');
  try{navigator.clipboard.writeText(txt).then(function(){toast('Report copied')},function(){toast('Copy blocked here')})}catch(err){toast('Copy blocked here')}}
});
document.addEventListener('keydown',function(e){
 if(sheetEl){if(e.key==='Escape'){closeSheet();return}
  if(e.key==='Tab'){var f=sheetEl.querySelectorAll('button,input');if(!f.length)return;var first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}
  return}
 if(S.tab!=='remote'||e.target.tagName==='INPUT')return;
 var map={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',Enter:'OK',Backspace:'BACK','+':'VOL_UP','-':'VOL_DOWN',m:'MUTE',h:'HOME'};
 var kk=map[e.key];if(!kk)return;e.preventDefault();
 hit(document.querySelector('[data-key="'+kk+'"]'));send(kk);
});
/* theme switcher + screenshot states */
(function(){
 var sel=document.getElementById('themesel');
 sel.innerHTML='<option value="">System (light or dark)</option>'+Object.keys(THEMES).map(function(id){return '<option value="'+id+'">'+THEME_NAMES[id]+(FREE_THEMES.indexOf(id)<0?' (Plus)':'')+'</option>'}).join('');
 sel.addEventListener('change',function(){setTheme(sel.value);render()});
 var want=Q.get('theme');
 S.rtheme=applyTheme(want!==null&&THEMES[want]?want:storedTheme());sel.value=S.rtheme;
 if(SHOT){
  /* store screenshots: generic demo TVs only, no platform or brand names */
  S.last={k:'OK',ms:24};
 }
 var view=Q.get('view');
 if(view==='tvs')S.tab='tvs';
 if(view==='apps')S.tab='apps';
 render();
 if(view==='add')addSheet();
 if(view==='numpad'){numpadSheet();var sh=document.getElementById('numshow');if(sh)sh.textContent='701'}
 if(view==='keyboard'){keyboardSheet();var kb=document.getElementById('kbd');if(kb)kb.value='cooking shows'}
 if(view==='switch')switchSheet();
 if(view==='voice'){var v=document.getElementById('voice');if(v){v.classList.add('on');v.querySelector('span').textContent='Listening… let go to send'}}
})();
})();
</script>

</body></html>
