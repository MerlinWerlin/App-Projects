name: CloudCompanion
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  CloudCompanion:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jared797.cloudcompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cloud Companion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Generated/App-Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: Choose your current city for the weather. Your widget then uses that saved location.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [cloudcompanion]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups: [group.com.jared797.cloudcompanion]
    dependencies:
      - target: CloudCompanionWidget
        embed: true
  CloudCompanionWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jared797.cloudcompanion.widget
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: Cloud Companion
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups: [group.com.jared797.cloudcompanion]
schemes:
  CloudCompanion:
    build:
      targets:
        CloudCompanion: all
        CloudCompanionWidget: all
