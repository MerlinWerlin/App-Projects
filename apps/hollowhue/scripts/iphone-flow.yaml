- tapOn: Undo
- tapOn: Redo
- takeScreenshot: 08-paint-at-zoom-20
- tapOn: Back to scenes
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: New art. Six zooms. Twenty in Mega.
    timeout: 60000
- tapOn:
