appId: com.jared797.hollowhue
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: New art. Six zooms. Twenty in Mega.
    timeout: 60000
- takeScreenshot: 01-categories
- scrollUntilVisible:
    element:
      text: Open Storybook Places
    direction: DOWN
    timeout: 20000
- tapOn: Open Storybook Places
- assertVisible: '.*Zoom 0 of 6.*'
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 1 of 6.*'
- takeScreenshot: 03-realistic-cafe
- tapOn: Whole scene
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: '.*Zoom 0 of 6.*'
- takeScreenshot: 02-realistic-cottage
- tapOn: Back to scenes
- scrollUntilVisible:
    element:
      id: difficulty-beginner
    direction: UP
    timeout: 20000
- tapOn:
    id: difficulty-beginner
- tapOn:
    id: category-flowers
- takeScreenshot: 02-beginner-flowers
- scrollUntilVisible:
    element:
      text: Open Garden Blooms
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
    centerElement: true
    speed: 20
- tapOn: Open Garden Blooms
- assertVisible: '.*Zoom 0 of 6.*'
- tapOn: Mix a colour
- tapOn:
    id: colour-hex
- eraseText: 7
- inputText: '#3388DD'
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: Use this colour
    direction: DOWN
    timeout: 15000
- takeScreenshot: 03-colour-picker
- tapOn: Use this colour
- assertVisible: 'Recent colour #3388DD'
- tapOn:
    point: '30%,32%'
- tapOn: Undo
- tapOn: Redo
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 1 of 6.*'
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 2 of 6.*'
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 3 of 6.*'
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 4 of 6.*'
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 5 of 6.*'
- tapOn: Look closer
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '.*Zoom 6 of 6.*'
- takeScreenshot: 04-sixth-zoom
- tapOn: Draw
- swipe:
    start: '30%,30%'
    end: '55%,35%'
    duration: 500
- tapOn: Undo
- tapOn: Redo
- takeScreenshot: 05-drawing
- tapOn: Back to scenes
- scrollUntilVisible:
