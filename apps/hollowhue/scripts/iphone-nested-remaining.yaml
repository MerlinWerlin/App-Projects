appId: com.jared797.hollowhue
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Hidden detail inside each artwork
    timeout: 60000
- takeScreenshot: 01-separated-collections
- scrollUntilVisible:
    element:
      id: difficulty-beginner
    direction: UP
    timeout: 30000
    visibilityPercentage: 40
    centerElement: true
- tapOn:
    id: difficulty-beginner
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      id: scene-art-begin-daisy
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 100
    centerElement: true
    speed: 55
- tapOn:
    id: scene-art-begin-daisy
- assertNotVisible: Look closer
- takeScreenshot: 02-independent-daisies
- tapOn: Mix a colour
- tapOn:
    id: colour-hex
- eraseText: 7
- inputText: '#3388DD'
- pressKey: Enter
- scrollUntilVisible:
