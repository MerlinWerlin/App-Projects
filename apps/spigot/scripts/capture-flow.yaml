# Spigot store captures (simulator, EXPO_PUBLIC_SPIGOT_CAPTURE=1 build). Every number is typed through the real keypad.
# Screens are opened with spigot:// links (Maestro's back is Android-only).
appId: com.jared797.spigot
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "WHERE DO YOU WORK?"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Australia\\..*"
- takeScreenshot: 00-country
- tapOn:
    text: "Continue.*"
- extendedWaitUntil:
    visible: "SPIGOT"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 00-home-welcome
- scrollUntilVisible:
    element:
      text: "Got it"
    direction: DOWN
- tapOn: "Got it"
- scrollUntilVisible:
    element:
      text: "SPIGOT"
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-home

# Offset: 300 mm at 45° with 18 mm take-offs
- openLink: "spigot://tool/offset"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn:
    text: "Offset \\(centre to centre\\).*"
- tapOn: "3"
- tapOn: "0"
- tapOn: "0"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "1"
- tapOn: "8"
- tapOn: "Next"
- tapOn: "1"
- tapOn: "8"
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-offset
- scrollUntilVisible:
    element:
      text: "Show working"
    direction: DOWN
- tapOn: "Show working"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-offset-working

# Cut list: 1450 × 5, 875 × 7, 2210 × 3
- openLink: "spigot://tool/cutlist"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn:
    text: "Piece length.*"
- tapOn: "1"
- tapOn: "4"
- tapOn: "5"
- tapOn: "0"
- tapOn: "Next"
- tapOn: "Clear all"
- tapOn: "5"
- tapOn: "Done"
- tapOn: "Add to list"
- tapOn:
    text: "Piece length.*"
- tapOn: "8"
- tapOn: "7"
- tapOn: "5"
- tapOn: "Next"
- tapOn: "Clear all"
- tapOn: "7"
- tapOn: "Done"
- tapOn: "Add to list"
- tapOn:
    text: "Piece length.*"
- tapOn: "2"
- tapOn: "2"
- tapOn: "1"
- tapOn: "0"
- tapOn: "Next"
- tapOn: "Clear all"
- tapOn: "3"
- tapOn: "Done"
- tapOn: "Add to list"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-cutlist
- scrollUntilVisible:
    element:
      text: "LENGTHS? 1.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-cutlist-plan

# Fall: 12 m at the first common grade (1:40 in Australia) from RL 10.500
- openLink: "spigot://tool/fall"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn:
    text: "Length of run.*"
- tapOn: "1"
- tapOn: "2"
- tapOn: "m"
- tapOn: "Done"
- tapOn:
    text: "Start invert level.*"
- tapOn: "1"
- tapOn: "0"
- tapOn: "."
- tapOn: "5"
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-fall

# Cut length: 1000 mm, DN100 88° bend centre to a bare end
- openLink: "spigot://tool/cut"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn:
    text: "Measurement.*"
- tapOn: "1"
- tapOn: "0"
- tapOn: "00"
- tapOn: "Done"
- tapOn: "Choose fitting A"
- tapOn:
    text: "DN100 88° bend, take-off.*"
- scrollUntilVisible:
    element:
      text: "Choose fitting B"
    direction: DOWN
- tapOn:
    text: "Pipe end / wall"
    index: 1
- scrollUntilVisible:
    element:
      text: "Cut the pipe to.*"
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-cut

# Volume: DN20 Type B copper, 25 m
- openLink: "spigot://tool/flow"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn:
    text: "DN20, inside .*"
- tapOn:
    text: "Length of pipe.*"
- tapOn: "2"
- tapOn: "5"
- tapOn: "m"
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-volume

# Reference and jobs
- openLink: "spigot://reference"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-reference
- openLink: "spigot://jobs"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-jobs-empty

# Inches: switch units in Settings, then an offset typed with a fraction key
- openLink: "spigot://settings"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn: "Inches (ft, in)"
- openLink: "spigot://tool/offset"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn:
    text: "Offset \\(centre to centre\\).*"
- tapOn: "1"
- tapOn: "2"
- tapOn: "plus 1/2 inch"
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-offset-inches
- openLink: "spigot://settings"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- tapOn: "Millimetres (mm, m)"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12-settings

# Paywall (capture build: the Australian list price, no App Store on a simulator)
- openLink: "spigot://unlock"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 13-unlock

# Locked tool preview (capture-only link): the real sample result, blurred, with the unlock card
- openLink: "spigot://tool/cutlist?preview=1"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "CUT LIST IS IN FULL UNLOCK"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 14-locked-preview
