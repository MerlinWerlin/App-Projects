name: trammel store capture
# Builds Trammel for the iOS simulator with EXPO_PUBLIC_TRAMMEL_CAPTURE=1 (store stub: every tool open; the paywall
# shows the new-customer state for the purchase review screenshot), opens each screen by deep link on a 6.9-inch
# iPhone simulator and saves screenshots (1320 x 2868) in light and dark. Also a functional smoke test: every route
# must render without the app exiting. Nothing here ships anything.
on:
  workflow_dispatch:
  # A branch push that changes the request file runs it too (workflow_dispatch needs the file on main first).
  push:
    branches-ignore: [main]
    paths: ['apps/trammel/store/capture-request.txt']
permissions:
  contents: read
concurrency:
  group: trammel-store-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    # GitHub's hosted Mac (Xcode 26, iOS 26 simulators): the shared xcode-27 runner takes one job at a time.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/trammel
    env:
      EXPO_PUBLIC_TRAMMEL_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Prebuild
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -100 "$RUNNER_TEMP/pods.log"; exit 1; }
      - name: Build the simulator app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/build.log" 2>&1 \
            || { tail -180 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Capture every screen
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/derived/Build/Products/Release-iphonesimulator/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];a=[x for r,xs in sorted(d.items(),reverse=True) if "iOS" in r for x in xs if x["name"].startswith("iPhone") and "Pro Max" in x["name"]];print(a[0]["udid"])')
          xcrun simctl list devices available | grep "$DEVICE"
          # Pre-approve trammel:// so `simctl openurl` doesn't stop at iOS's "Open in Trammel?" prompt.
          PREFS=~/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Preferences
          mkdir -p "$PREFS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.CoreSimulator.CoreSimulatorBridge-->trammel string $BID" "$PREFS/com.apple.launchservices.schemeapproval.plist" || true
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" defaults write com.apple.launchservices.schemeapproval "com.apple.CoreSimulator.CoreSimulatorBridge-->trammel" -string "$BID" || true
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" "$APP"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          # Every simulator call gets a time limit (macOS has no `timeout`), so a hang fails fast instead of stalling.
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          running() { for _ in 1 2 3; do t 20 xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -q "UIKitApplication:$BID" && return 0; sleep 3; done; return 1; }
          crashlog() { find ~/Library/Logs/DiagnosticReports -newer "$APP" -name '*.ips' -exec cp {} "$OUT/" \; 2>/dev/null || true; ls "$OUT"/*.ips 2>/dev/null && head -c 4000 "$OUT"/*.ips || echo "no crash report"; }
          FAIL=0
          for MODE in light dark; do
            t 30 xcrun simctl ui "$DEVICE" appearance $MODE || true
            t 30 xcrun simctl terminate "$DEVICE" "$BID" 2>/dev/null || true
            t 60 xcrun simctl launch "$DEVICE" "$BID" || { echo "::error::launch command failed"; FAIL=1; }
            sleep 15
            if running; then echo "LAUNCH OK ($MODE)"; else echo "::error::Trammel is not running 15 s after launch ($MODE)"; crashlog; exit 1; fi
            t 30 xcrun simctl io "$DEVICE" screenshot "$OUT/$MODE-00-home.png" || true
            i=1; PREV=""
            for R in stairs rafter hip crown mitre layout decking cutlist square arc convert pitch jobs settings paywall welcome 'rafter?locked=1'; do
              N=$(echo "$R" | sed 's/?locked=1/-locked/')
              t 30 xcrun simctl openurl "$DEVICE" "trammel:///$R" || echo "::warning::openurl $R timed out"
              sleep 5
              t 30 xcrun simctl io "$DEVICE" screenshot "$OUT/$MODE-$(printf %02d $i)-$N.png" || true
              CUR="$OUT/$MODE-$(printf %02d $i)-$N.png"; if [ -n "${PREV:-}" ] && cmp -s "$PREV" "$CUR"; then echo "::error::$N ($MODE) looks the same as the screen before: the deep link did not open"; FAIL=1; fi; PREV="$CUR"
              if ! running; then echo "::error::Trammel exited on $N ($MODE)"; FAIL=1; crashlog; t 60 xcrun simctl launch "$DEVICE" "$BID" || true; sleep 8; fi
              i=$((i+1))
            done
          done
          find ~/Library/Logs/DiagnosticReports -newer "$APP" -name '*.ips' -exec cp {} "$OUT/" \; 2>/dev/null || true
          ls -la "$OUT"
          exit $FAIL
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trammel-store-capture
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
