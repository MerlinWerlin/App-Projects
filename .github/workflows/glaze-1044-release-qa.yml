name: Glaze 1.0.44 release QA (iOS 27 simulator)
# Before the 1.0.44 RELEASE.json merge: a Release simulator build with the iOS 27 SDK (Xcode 27) and
# bundled JavaScript, launched on an iOS 27 iPhone simulator. An XCUITest (scripts/native-1044-release-qa-tests.swift)
# browses the Themes tab (catalog-v2.json from R2), downloads and applies two new themes and shows their
# Clock / Battery / Calendar designs and Artwork 1-5, with a screenshot at every step.
# QA-only change, never shipped: modules/glaze-store is parked (the documented one-build switch, RELEASING.md 7)
# so Plus is the on-device mock, which is seeded to "unlocked" because the new themes are Plus. The lockfile is
# used as it ships (expo-modules-core / react-native versions are printed).
on:
  push:
    branches: ['claude/glaze-1044']
    paths: ['.github/workflows/glaze-1044-release-qa.yml', 'apps/glaze/scripts/native-1044-release-qa-tests.swift', 'apps/glaze/scripts/qa-1044-build-run.txt']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: glaze-1044-release-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: apps/glaze
    env:
      GLAZE_NATIVE: '1'
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select Xcode 27
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/glaze-1044-qa"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          X=$(ls -d /Applications/Xcode_27*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          { xcodebuild -version; echo "iOS SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"; } | tee "$OUT/toolchain.txt"
          RUN=$(tr -dc '0-9' < scripts/qa-1044-build-run.txt 2>/dev/null || true)
          echo "REUSE_RUN=$RUN" >> "$GITHUB_ENV"
      - name: Reuse an earlier QA build of the same app (optional)
        if: env.REUSE_RUN != ''
        run: |
          set -euo pipefail
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" -n glaze-1044-qa-app -D "$RUNNER_TEMP/app"
          ditto -x -k "$RUNNER_TEMP/app/Glaze-app.zip" "$RUNNER_TEMP/products"
          cp "$RUNNER_TEMP/app/app-source.txt" "$OUT/" || true
      - name: Install the native build dependencies (lockfile as shipped)
        if: env.REUSE_RUN == ''
        run: |
          set -euo pipefail
          node scripts/native-link.mjs 1
          # QA only: Plus becomes the on-device mock (no StoreKit sandbox on an unsigned simulator build).
          mkdir -p ../qa-parked && mv modules/glaze-store ../qa-parked/glaze-store
          npm install --no-audit --no-fund > "$OUT/install.log" 2>&1 || { tail -100 "$OUT/install.log"; exit 1; }
          node scripts/eas-native-deps.js >> "$OUT/install.log" 2>&1 || { tail -100 "$OUT/install.log"; exit 1; }
          node -e 'for (const p of ["expo","expo-modules-core","react-native","react-native-svg"]) console.log(p, require(p + "/package.json").version)' | tee "$OUT/versions.txt"
          git diff --stat -- package-lock.json | tee -a "$OUT/versions.txt"
      - name: Prebuild and pods
        if: env.REUSE_RUN == ''
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install > "$OUT/prebuild.log" 2>&1 || { tail -120 "$OUT/prebuild.log"; exit 1; }
          cd ios && pod install > "$OUT/pods.log" 2>&1 || { tail -120 "$OUT/pods.log"; exit 1; }
      - name: Build the Release simulator app (iOS 27 SDK, bundled JavaScript)
        if: env.REUSE_RUN == ''
        run: |
          set -euo pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO build > "$OUT/build.log" 2>&1 \
            || { grep -n "error:" "$OUT/build.log" | head -40; tail -120 "$OUT/build.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/products" && cp -R "$RUNNER_TEMP"/derived/Build/Products/Release-iphonesimulator/*.app "$RUNNER_TEMP/products/"
          APP=$(ls -d "$RUNNER_TEMP"/products/*.app | head -1)
          test -f "$APP/main.jsbundle"
          echo "source $GITHUB_SHA version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" > "$OUT/app-source.txt"
          mkdir -p "$RUNNER_TEMP/app" && ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app/Glaze-app.zip" && cp "$OUT/app-source.txt" "$RUNNER_TEMP/app/"
      - uses: actions/upload-artifact@v4
        if: env.REUSE_RUN == ''
        with:
          name: glaze-1044-qa-app
          path: ${{ runner.temp }}/app
          retention-days: 7
      - name: Build the UI test runner
        run: |
          set -euo pipefail
          ruby scripts/prepare-native-link-test.rb "$RUNNER_TEMP/GlazeLinkCheck" native-1044-release-qa-tests.swift release-qa
          xcodebuild -project "$RUNNER_TEMP/GlazeLinkCheck/GlazeLinkCheck.xcodeproj" -scheme GlazeLinkCheck -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/link-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing > "$OUT/runner-build.log" 2>&1 || { tail -120 "$OUT/runner-build.log"; exit 1; }
      - name: Install on an iOS 27 iPhone, launch check, seed the QA Plus mock
        run: |
          set -euo pipefail
          APP=$(ls -d "$RUNNER_TEMP"/products/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Glaze $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($BID)" | tee -a "$OUT/toolchain.txt"
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];a=[x for r,xs in sorted(d.items(),reverse=True) if "iOS-27" in r for x in xs if x["name"].startswith("iPhone") and not any(w in x["name"] for w in ("Duo","Fold","Flip"))];p=next((x for x in a if " Pro" in x["name"] and "Max" not in x["name"]),a[0]);print(p["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$DEVICE" | tee -a "$OUT/toolchain.txt"
          codesign --force --deep --sign - "$APP"
          xcrun simctl boot "$DEVICE" || true; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" "$APP"
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BID" data)
          STORE="$DATA/Library/Application Support/$BID/RCTAsyncLocalStorage_V1"
          mkdir -p "$STORE"
          printf '%s' '{"glaze.plus.mock.v1":"{\"plus\":true}"}' > "$STORE/manifest.json"
          xcrun simctl spawn "$DEVICE" log stream --level error --predicate 'process == "'"$(basename "$APP" .app)"'"' > "$OUT/app-errors.log" 2>&1 &
          L=$(xcrun simctl launch "$DEVICE" "$BID"); echo "$L"; PID=${L##* }
          sleep 30
          xcrun simctl io "$DEVICE" screenshot "$OUT/launch-30s.png" || true
          if kill -0 "$PID" 2>/dev/null; then echo "PASS: running 30 s after launch on iOS 27" | tee -a "$OUT/toolchain.txt"; else
            find ~/Library/Logs/DiagnosticReports -newer "$APP" -name '*.ips' -exec cp {} "$OUT/" \; 2>/dev/null || true
            echo "::error::Glaze is not running 30 s after launch on iOS 27"; exit 1; fi
          xcrun simctl terminate "$DEVICE" "$BID" || true
      - name: Browse, download and apply two new themes (XCUITest)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls "$RUNNER_TEMP"/link-build/Build/Products/*.xctestrun | head -1)
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,id=$DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/qa.xcresult" -only-testing:GlazeLinkUITests/GlazeRelease1044Tests/testRelease1044 > "$OUT/ui-test.log" 2>&1 || { grep -n "GLAZE_QA\|error\|failed" "$OUT/ui-test.log" | tail -60; exit 1; }
          grep -F GLAZE_QA_1044_DONE "$OUT/ui-test.log"
          grep -F GLAZE_QA_STEP "$OUT/ui-test.log" | tail -80
      - name: Export screenshots
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/qa.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/qa.xcresult" --output-path "$OUT/attachments" > "$OUT/attachment-export.log" 2>&1 || true
          find ~/Library/Logs/DiagnosticReports -name 'Glaze*.ips' -mmin -120 -exec cp {} "$OUT/" \; 2>/dev/null || true
          ls -R "$OUT" | head -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-1044-release-qa
          path: ${{ runner.temp }}/glaze-1044-qa
          retention-days: 14
