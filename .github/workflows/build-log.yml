# Fetch an EAS build's logs and post the errors as a commit comment (so Claude can read them without the Expo page).
name: build-log

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder (linework, glaze, couch)'
        required: true
        type: string
      build:
        description: 'EAS build id (empty = latest iOS build)'
        required: false
        type: string

jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Collect
        run: |
          set +e
          if [ -n "${{ inputs.build }}" ]; then
            eas build:view "${{ inputs.build }}" --json > "$RUNNER_TEMP/raw.txt" 2>"$RUNNER_TEMP/err.txt"
            sed -n '/^{/,$p' "$RUNNER_TEMP/raw.txt" > "$RUNNER_TEMP/b.json"
          else
            eas build:list --platform ios --limit 1 --json --non-interactive > "$RUNNER_TEMP/raw.txt" 2>"$RUNNER_TEMP/err.txt"
            sed -n '/^\[/,$p' "$RUNNER_TEMP/raw.txt" | jq '.[0]' > "$RUNNER_TEMP/b.json"
          fi
          jq '{id, status, appVersion, appBuildVersion, error}' "$RUNNER_TEMP/b.json" > "$RUNNER_TEMP/sum.txt" 2>>"$RUNNER_TEMP/err.txt"
          : > "$RUNNER_TEMP/logs.txt"
          for u in $(jq -r '.logFiles[]? // empty' "$RUNNER_TEMP/b.json"); do curl -sL --compressed "$u" -o "$RUNNER_TEMP/one"; file "$RUNNER_TEMP/one" >> "$RUNNER_TEMP/err.txt"; (gunzip -c "$RUNNER_TEMP/one" 2>/dev/null || cat "$RUNNER_TEMP/one") >> "$RUNNER_TEMP/logs.txt"; echo >> "$RUNNER_TEMP/logs.txt"; done
          # EAS logs are JSON lines; keep the message text, then the lines around errors.
          (jq -r 'select(.msg) | (.phase // "") + " | " + .msg' "$RUNNER_TEMP/logs.txt" 2>/dev/null || cat "$RUNNER_TEMP/logs.txt") > "$RUNNER_TEMP/plain.txt"
          grep -n -i -E "error|fail|❌|not found|cannot|unable|ERESOLVE|peer|npm ERR|npm error" "$RUNNER_TEMP/plain.txt" | head -80 > "$RUNNER_TEMP/hits.txt"
          tail -n 60 "$RUNNER_TEMP/plain.txt" > "$RUNNER_TEMP/tail.txt"
          body=$(printf '**build-log %s**\n\n```\n%s\n%s\n```\n\nError lines:\n```\n%s\n```\n\nLast lines:\n```\n%s\n```\n' "${{ inputs.app }}" "$(cat "$RUNNER_TEMP/sum.txt")" "$(tail -c 3000 "$RUNNER_TEMP/err.txt")" "$(head -c 25000 "$RUNNER_TEMP/hits.txt")" "$(tail -c 25000 "$RUNNER_TEMP/tail.txt")")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" > /dev/null
