# Build an app's iOS binary on a GitHub macOS runner (free for this public repo) instead of Expo's cloud,
# then upload it to TestFlight with `eas submit`. Use when Expo's monthly free iOS builds are used up
# ("This account has used its iOS builds from the Free plan this month"). Same signing as ship.yml:
# the certificate, provisioning profile and App Store Connect key all come from Expo's credentials service.
# Started by hand (or by Claude through the API) with the app folder; reads that app's RELEASE.json.
name: ship-mac

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder (cue, backspin, couch, glaze, linework)'
        required: true
        type: string

concurrency:
  group: ship-mac-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version | tee "$RUNNER_TEMP/ship.log"
          pod --version || sudo gem install cocoapods
          fastlane --version | tail -1 || brew install fastlane

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Read RELEASE.json
        id: rel
        run: |
          echo "note=$(jq -r '.note // "Owner-approved release"' RELEASE.json)" >> "$GITHUB_OUTPUT"
          echo "ascAppId=$(jq -r '.ascAppId // empty' RELEASE.json)" >> "$GITHUB_OUTPUT"
          echo "profile=$(jq -r '.profile // "production"' RELEASE.json)" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Native-only tools for the build profile
        env:
          PROFILE: ${{ steps.rel.outputs.profile }}
        run: |
          if jq -e '.scripts["eas-build-post-install"]' package.json > /dev/null; then
            while IFS='=' read -r k v; do [ -n "$k" ] && export "$k=$v"; done < <(jq -r --arg p "$PROFILE" '.build[$p].env // {} | to_entries[] | "\(.key)=\(.value)"' eas.json)
            npm run eas-build-post-install
          fi

      - name: Submit profile (App Store Connect app id)
        env:
          ASC_APP_ID: ${{ steps.rel.outputs.ascAppId }}
        run: |
          if [ -n "$ASC_APP_ID" ]; then
            jq --arg a "$ASC_APP_ID" '.submit.production.ios = ((.submit.production.ios // {}) + {ascAppId: $a})' eas.json > eas.tmp.json
            mv eas.tmp.json eas.json
          fi

      - name: Build on this Mac
        run: |
          set -o pipefail
          eas build --platform ios --profile "${{ steps.rel.outputs.profile }}" --local --non-interactive \
            --output "$RUNNER_TEMP/app.ipa" 2>&1 | tee -a "$RUNNER_TEMP/ship.log"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive --wait 2>&1 | tee -a "$RUNNER_TEMP/ship.log"

      - name: Report the result on the commit (readable without the Actions page)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ job.status }}"
          body=$(printf '**ship-mac (%s): %s.** %s\n\nLast lines:\n\n```\n%s\n```\n' "${{ inputs.app }}" "$status" "${{ steps.rel.outputs.note }}" "$( (grep -v -E '^\s*$' "$RUNNER_TEMP/ship.log" | awk 'length($0) < 400' | tail -n 60) 2>/dev/null || echo 'no log')")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" > /dev/null
