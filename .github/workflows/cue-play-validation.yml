name: Cue Android validation
on:
  push:
    branches: [codex/cue-google-play-release-20261103]
    paths:
      - 'apps/cue/app/**'
      - 'apps/cue/src/**'
      - 'apps/cue/package*.json'
      - 'apps/cue/app.config.js'
      - 'apps/cue/ops/play-variant.cjs'
      - 'scripts/play/**'
      - '.github/workflows/cue-play-validation.yml'
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Reuse a verified APK only when app source is identical
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.apk_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLAY_VARIANT: preview
      EAS_BUILD_PLATFORM: android
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install current source
        working-directory: apps/cue
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/cue
        run: npm run typecheck
      - name: Run unit and native contract tests
        working-directory: apps/cue
        run: |
          if [ ! -d node_modules/@react-native/jest-preset ]; then
            npm install --no-save --no-audit --no-fund "@react-native/jest-preset@$(node -p 'require("react-native/package.json").version')"
          fi
          npx jest --runInBand
          node --test scripts/patch-speech.test.cjs
      - name: Generate offline Android test variant
        working-directory: apps/cue
        run: |
          npx expo prebuild --platform android --no-install
          mkdir -p ../../cue-android-output
          npx expo config --type public --json > ../../cue-android-output/config.json
          node -e 'const c=require("../../cue-android-output/config.json");if(c.android.package!=="com.jared797.cue.playtest"||c.updates.enabled!==false)throw Error("Expected isolated offline test variant")'
      - name: Build actual standalone test APK
        working-directory: apps/cue/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Dorg.gradle.jvmargs=-Xmx4g
      - name: Inspect actual APK
        run: |
          cp apps/cue/android/app/build/outputs/apk/release/app-release.apk cue-android-output/cue-play-test.apk
          git rev-parse HEAD > cue-android-output/source-commit.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs cue-android-output/cue-play-test.apk > cue-android-output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging cue-android-output/cue-play-test.apk > cue-android-output/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree cue-android-output/cue-play-test.apk AndroidManifest.xml > cue-android-output/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 cue-android-output/cue-play-test.apk > cue-android-output/zipalign.txt
          python scripts/play/verify_apk.py cue-android-output/cue-play-test.apk cue-android-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cue-android-current-apk
          path: cue-android-output/
          if-no-files-found: ignore
          retention-days: 14
  simulate:
    needs: build
    if: always() && !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.apk_run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: google_apis
            page: '4096'
          - target: google_apis_ps16k
            page: '16384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: cue-android-current-apk
          path: cue-android-output
          run-id: ${{ inputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Bind APK app source and simulation source
        run: |
          source=$(cat cue-android-output/source-commit.txt)
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$source"
          git diff --exit-code "$source" "$GITHUB_SHA" -- apps/cue ':!apps/cue/docs/**' ':!apps/cue/store/**'
          printf '%s\n' "$GITHUB_SHA" > cue-android-output/simulation-workflow-source.txt
          python scripts/play/verify_apk.py cue-android-output/cue-play-test.apk cue-android-output
      - name: Install checksum-verified Maestro
        run: |
          curl -fLsS https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          curl -fLsS https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/checksums_sha256.txt -o "$RUNNER_TEMP/checksums_sha256.txt"
          (cd "$RUNNER_TEMP" && grep 'maestro.zip' checksums_sha256.txt | sha256sum -c -)
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/cue-maestro"
          echo "$RUNNER_TEMP/cue-maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration on the disposable Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run current APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_PAGE_SIZE: ${{ matrix.page }}
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/play/cue-simulate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cue-android-simulation-${{ matrix.page }}
          path: |
            cue-android-output/captures/
            cue-android-output/*.txt
            cue-android-output/*.json
            cue-android-output/*.png
          retention-days: 14
