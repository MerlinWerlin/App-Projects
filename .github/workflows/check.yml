# Checks an app on every push to a non-main branch that touches it (and on demand):
# install -> align Expo SDK versions -> typecheck -> tests -> bundle for iOS and Android (what Expo Go loads).
# If version alignment changed package.json / the lockfile, the fix is committed back to the branch.
# Claude reads the result with `gh run view`; nothing here ships anything.
name: check

on:
  push:
    branches-ignore: [main]
    paths: ['apps/cue/**', '.github/workflows/check.yml']
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder (cue, backspin, crochet, couch, glaze, linework)'
        required: true
        type: string

concurrency:
  group: check-${{ github.ref }}-${{ inputs.app || 'cue' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP: ${{ inputs.app || 'cue' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: apps/${{ env.APP }}
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi 2>&1 | tee /tmp/step-install.log

      - name: Align Expo SDK versions
        working-directory: apps/${{ env.APP }}
        run: set -o pipefail; npx expo install --fix 2>&1 | tee /tmp/step-align.log

      - name: Typecheck
        working-directory: apps/${{ env.APP }}
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee /tmp/step-typecheck.log

      # Newer jest-expo needs the React Native Jest preset as a separate package; add it for the run only
      # (no package.json change) when an app does not list it.
      - name: Test preset (jest-expo peer)
        if: success() || failure()
        working-directory: apps/${{ env.APP }}
        run: |
          if [ -d node_modules/jest-expo ] && [ ! -d node_modules/@react-native/jest-preset ]; then
            rn=$(node -p "require('react-native/package.json').version" 2>/dev/null || echo latest)
            npm install --no-save --no-audit --no-fund "@react-native/jest-preset@$rn" || npm install --no-save --no-audit --no-fund @react-native/jest-preset || true
          fi

      # Tests and the bundle still run when the typecheck fails, so one old type error never hides them.
      - name: Tests
        if: success() || failure()
        working-directory: apps/${{ env.APP }}
        run: set -o pipefail; npm test 2>&1 | tee /tmp/step-tests.log

      - name: Bundle (iOS + Android, as Expo Go loads it)
        if: success() || failure()
        working-directory: apps/${{ env.APP }}
        run: set -o pipefail; npx expo export --platform ios --platform android --output-dir /tmp/export 2>&1 | tee /tmp/step-bundle.log

      - name: Expo doctor (advisory)
        working-directory: apps/${{ env.APP }}
        continue-on-error: true
        run: npx expo-doctor 2>&1 | tee /tmp/step-doctor.log

      - name: Post the result as a commit comment (readable without the log host)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### check ${APP}: ${{ job.status }}"
            for f in install align typecheck tests bundle doctor; do
              [ -f /tmp/step-$f.log ] || continue
              echo; echo "<details><summary>$f</summary>"; echo; echo '```'
              grep -v '^\s*$' /tmp/step-$f.log | tail -n 60 | cut -c1-300
              echo '```'; echo "</details>"
            done
          } > /tmp/comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/comment.md >/dev/null

      - name: Commit version alignment
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "app-factory-bot"
          git config user.email "app-factory-bot@users.noreply.github.com"
          git add apps/${APP}/package.json apps/${APP}/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "${APP}: align package versions with the Expo SDK [check]"
            git push
          fi
