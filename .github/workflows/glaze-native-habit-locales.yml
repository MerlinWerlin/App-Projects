name: Glaze native habit languages
on:
  push:
    branches: ['codex/glaze-theme-release-20261101']
    paths: ['apps/glaze/scripts/native-habit-locale-review.swift', '.github/workflows/glaze-native-habit-locales.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  languages:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual native content and copy actual extension translations
        working-directory: apps/glaze
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GlazeHabitLocaleReview.app"
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SOURCES=()
          for FILE in targets/widget/*.swift; do
            if [[ "$FILE" != "targets/widget/GlazeWidgetsBundle.swift" ]]; then SOURCES+=("$FILE"); fi
          done
          xcrun swiftc -parse-as-library -sdk "$SDK" -target "$(uname -m)-apple-ios17.0-simulator" "${SOURCES[@]}" scripts/native-habit-locale-review.swift -o "$APP/GlazeHabitLocaleReview" > "$RUNNER_TEMP/glaze-habit-locale-compile.log" 2>&1 || { tail -100 "$RUNNER_TEMP/glaze-habit-locale-compile.log"; exit 1; }
          cp docs/native-habit-review-profiles.json "$APP/"
          cp -R targets/widget/*.lproj "$APP/"
          python3 - <<'PY'
          import os,plistlib,pathlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'GlazeHabitLocaleReview.app'
          info={'CFBundleIdentifier':'com.glaze.habit-locale-review','CFBundleExecutable':'GlazeHabitLocaleReview','CFBundleName':'GlazeHabitLocaleReview','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'17.0','UIDeviceFamily':[1],'LSRequiresIPhoneOS':True,'UILaunchScreen':{},'CFBundleDevelopmentRegion':'en','UIApplicationSceneManifest':{'UIApplicationSupportsMultipleScenes':False},'ReviewSourceSHA':os.environ['GITHUB_SHA']}
          (app/'Info.plist').write_bytes(plistlib.dumps(info))
          PY
          codesign --force --sign - "$APP"
      - name: Launch a fresh process for every supported language and region
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/GlazeHabitLocaleReview.app"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.habit-locale-review data)
          SOURCE="$DATA/Library/Caches/GlazeHabitLocaleReview"
          while read -r LANGUAGE REGION; do
            xcrun simctl terminate "$DEVICE" com.glaze.habit-locale-review >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE" com.glaze.habit-locale-review -AppleLanguages "($LANGUAGE)" -AppleLocale "$REGION" --review-language "$LANGUAGE"
            for TRY in $(seq 1 120); do
              if [[ -f "$SOURCE/$LANGUAGE/_LOCALE_SUCCESS.json" || -f "$SOURCE/$LANGUAGE/_ERROR.txt" ]]; then break; fi
              sleep 1
            done
            if [[ -f "$SOURCE/$LANGUAGE/_ERROR.txt" ]]; then cat "$SOURCE/$LANGUAGE/_ERROR.txt"; exit 1; fi
            test -f "$SOURCE/$LANGUAGE/_LOCALE_SUCCESS.json"
          done <<'LANGUAGES'
          ar ar_EG
          de de_DE
          en en_US
          es es_ES
          fr fr_FR
          hi hi_IN
          it it_IT
          ja ja_JP
          ko ko_KR
          pt-BR pt_BR
          zh-Hans zh_CN
          LANGUAGES
          python3 - "$SOURCE" <<'PY'
          import json,pathlib,sys
          receipts=[json.loads(p.read_text()) for p in pathlib.Path(sys.argv[1]).glob('*/_LOCALE_SUCCESS.json')]
          assert len(receipts)==11 and sum(r['renders'] for r in receipts)==858
          assert all(r['renders']==78 and r['preferredLocalizations'][0]==r['language'] for r in receipts)
          print('858 actual translated native captures across11 supported language/region launches')
          PY
      - name: Preserve original language evidence even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/glaze-native-habit-locales"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.habit-locale-review data 2>/dev/null || true)
          if [[ -n "$DATA" && -d "$DATA/Library/Caches/GlazeHabitLocaleReview" ]]; then cp -R "$DATA/Library/Caches/GlazeHabitLocaleReview/." "$RUNNER_TEMP/glaze-native-habit-locales/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-native-habit-locales
          path: |
            ${{ runner.temp }}/glaze-native-habit-locales
            ${{ runner.temp }}/glaze-habit-locale-compile.log
          retention-days: 14
