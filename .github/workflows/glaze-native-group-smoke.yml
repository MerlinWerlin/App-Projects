name: Glaze installed shared habit storage
on:
  push:
    branches: ['codex/glaze-theme-release-20261101']
    paths: ['apps/glaze/scripts/native-group-smoke.*', 'apps/glaze/targets/widget/HabitStore.swift', 'apps/glaze/targets/widget/HabitIntents.swift', '.github/workflows/glaze-native-group-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-storage:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/glaze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compile production widget and intent sources into three entitled simulator hosts
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/glaze-group-smoke"
          mkdir -p "$OUT"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          SOURCES=()
          for FILE in targets/widget/*.swift; do
            if [[ "$FILE" != "targets/widget/GlazeWidgetsBundle.swift" ]]; then SOURCES+=("$FILE"); fi
          done
          xcrun swiftc -parse-as-library -sdk "$SDK" -target "$ARCH-apple-ios17.0-simulator" "${SOURCES[@]}" scripts/native-group-smoke.swift -o "$RUNNER_TEMP/GlazeGroupSmoke" > "$OUT/compile.log" 2>&1 || { tail -100 "$OUT/compile.log"; exit 1; }
          python3 - <<'PY'
          import os,pathlib,plistlib,shutil
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          for role in ['writer','intents','reader']:
              app=base/f'GlazeGroup-{role}.app';app.mkdir()
              shutil.copy(base/'GlazeGroupSmoke',app/'GlazeGroupSmoke')
              for resource in pathlib.Path('targets/widget').glob('*.lproj'):shutil.copytree(resource,app/resource.name)
              info={'CFBundleIdentifier':f'com.glaze.group-{role}','CFBundleExecutable':'GlazeGroupSmoke','CFBundleName':f'GlazeGroup-{role}','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'17.0','UIDeviceFamily':[1],'LSRequiresIPhoneOS':True,'UILaunchScreen':{},'UIApplicationSceneManifest':{'UIApplicationSupportsMultipleScenes':False},'ReviewSourceSHA':os.environ['GITHUB_SHA'],'ReviewRunID':os.environ['GITHUB_RUN_ID']}
              (app/'Info.plist').write_bytes(plistlib.dumps(info))
          (base/'group-entitlements.plist').write_bytes(plistlib.dumps({'com.apple.security.application-groups':['group.com.jared797.glaze']}))
          PY
          for ROLE in writer intents reader; do
            codesign --force --sign - --entitlements "$RUNNER_TEMP/group-entitlements.plist" "$RUNNER_TEMP/GlazeGroup-$ROLE.app"
          done
      - name: Exercise real shared storage and actual intent methods across installed processes
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/glaze-group-smoke"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          for ROLE in writer intents reader; do
            xcrun simctl install "$DEVICE" "$RUNNER_TEMP/GlazeGroup-$ROLE.app"
          done
          wait_receipt() {
            local DATA SOURCE
            DATA=$(xcrun simctl get_app_container "$DEVICE" "com.glaze.group-$1" data)
            SOURCE="$DATA/Library/Caches/GlazeGroupSmoke"
            for TRY in $(seq 1 60); do
              if [[ -f "$SOURCE/$2.json" || -f "$SOURCE/_ERROR.json" ]]; then break; fi
              sleep 1
            done
            mkdir -p "$OUT/$1"
            if [[ -d "$SOURCE" ]]; then cp -R "$SOURCE/." "$OUT/$1/"; fi
            if [[ -f "$SOURCE/_ERROR.json" ]]; then cat "$SOURCE/_ERROR.json"; return 1; fi
            test -f "$SOURCE/$2.json"
          }
          xcrun simctl launch --terminate-running-process "$DEVICE" com.glaze.group-writer clock
          wait_receipt writer clock
          node --no-warnings scripts/native-group-smoke.mjs prepare "$OUT/writer/clock.json" "$OUT/group-fixture.json"
          WRITER=$(xcrun simctl get_app_container "$DEVICE" com.glaze.group-writer data)
          mkdir -p "$WRITER/Documents"
          cp "$OUT/group-fixture.json" "$WRITER/Documents/group-fixture.json"
          xcrun simctl launch --terminate-running-process "$DEVICE" com.glaze.group-writer write
          wait_receipt writer write
          xcrun simctl launch "$DEVICE" com.glaze.group-intents intents
          wait_receipt intents intents
          xcrun simctl launch "$DEVICE" com.glaze.group-reader read
          wait_receipt reader read
          node --no-warnings scripts/native-group-smoke.mjs verify "$OUT/group-fixture.json" "$OUT/writer/write.json" "$OUT/intents/intents.json" "$OUT/reader/read.json" "$OUT/verification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-shared-habit-storage
          path: ${{ runner.temp }}/glaze-group-smoke
          retention-days: 14
