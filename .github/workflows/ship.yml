# Ship an app when its owner approves.
#
# How approval works: a build run (or Claude) opens a pull request that changes apps/<app>/RELEASE.json
# (and the code). Merging that pull request in the GitHub app IS the approval: this workflow then
#   mode "build"  -> starts ship-mac, which builds the iOS app on GitHub's free Mac runner and uploads it to
#                    App Store Connect / TestFlight. Expo's paid cloud builds are never used (owner decision, 10 Nov 2026).
#   mode "update" -> publishes an over-the-air update to phones already running that app version
#                    Only for apps that still have expo-updates; App Store apps without it (Guideline 5.6) fail on purpose.
# Nothing ships without a merge to main. Secrets are set once by the owner (docs/SHIPPING.md).
name: ship

on:
  push:
    branches: [main]
    paths: ['apps/*/RELEASE.json']
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder (linework, glaze, couch)'
        required: true
        type: string

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "apps=[\"${{ inputs.app }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$(scripts/changed-apps.sh)" >> "$GITHUB_OUTPUT"
          fi

  ship:
    needs: detect
    permissions:
      contents: write
      actions: write
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce owner release platform
        working-directory: .
        env:
          APP_FOLDER: ${{ matrix.app }}
        run: node scripts/check-ios-release.cjs

      - name: Check the owner's one-time setup
        run: |
          missing=""
          for s in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (see docs/SHIPPING.md)"; exit 1
          fi
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Read RELEASE.json
        id: rel
        run: |
          echo "mode=$(jq -r '.mode // "build"' RELEASE.json)" >> "$GITHUB_OUTPUT"
          echo "note=$(jq -r '.note // "Owner-approved release"' RELEASE.json | tr -d '"\`$')" >> "$GITHUB_OUTPUT"
          echo "ascAppId=$(jq -r '.ascAppId // empty' RELEASE.json)" >> "$GITHUB_OUTPUT"
          # Optional build profile (default production), e.g. "production-native" for Glaze's native parts.
          echo "profile=$(jq -r '.profile // "production"' RELEASE.json)" >> "$GITHUB_OUTPUT"
          # Optional: skip EAS capability sync when capabilities were set by hand in the Apple developer site
          # (Apple's API can't assign App Groups).
          echo "skipCapSync=$(jq -r 'if .skipCapabilitySync then "1" else "" end' RELEASE.json)" >> "$GITHUB_OUTPUT"
          # Optional: let EAS create/repair signing (certificate check, provisioning profile) with the App Store
          # Connect API key instead of an interactive Apple login. Needed for an app's first build from CI.
          echo "ascKeyAuth=$(jq -r 'if .ascKeyAuth then "1" else "" end' RELEASE.json)" >> "$GITHUB_OUTPUT"

      - name: Refuse an over-the-air update for an app without expo-updates
        if: steps.rel.outputs.mode == 'update'
        run: |
          if ! jq -e '.dependencies["expo-updates"]' package.json > /dev/null; then
            echo "${{ matrix.app }} has no expo-updates (no over-the-air updates, Apple Guideline 5.6). Set mode to build in RELEASE.json." | tee "$RUNNER_TEMP/ship.log"
            exit 1
          fi

      - name: Install packages
        if: steps.rel.outputs.mode == 'update'
        run: npm install --no-audit --no-fund

      - name: Native-only tools for the chosen build profile
        if: steps.rel.outputs.mode == 'update'
        env:
          PROFILE: ${{ steps.rel.outputs.profile }}
        run: |
          # Apps keep native-only build tools out of package.json (Expo Go safety) and add them in an
          # eas-build-post-install script. eas build reads the app config here first, so run that script
          # now too, with the profile's env (e.g. GLAZE_NATIVE=1), or config loading fails.
          if jq -e '.scripts["eas-build-post-install"]' package.json > /dev/null; then
            while IFS='=' read -r k v; do [ -n "$k" ] && export "$k=$v"; done < <(jq -r --arg p "$PROFILE" '.build[$p].env // {} | to_entries[] | "\(.key)=\(.value)"' eas.json)
            npm run eas-build-post-install
          fi

      - name: Link the Expo project (first time only)
        if: steps.rel.outputs.mode == 'update'
        run: |
          if [ "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" = "" ]; then
            eas init --non-interactive --force
            if jq -e '.dependencies["expo-updates"]' package.json > /dev/null; then
              eas update:configure --non-interactive || true
            fi
          fi

      - name: Build on GitHub's Mac (ship-mac) and upload to TestFlight
        if: steps.rel.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No Expo cloud build: the owner does not pay for it, and the free plan's iOS builds run out.
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/ship-mac.yml/dispatches" -f ref=main -f "inputs[app]=${{ matrix.app }}"
          echo "Started ship-mac for ${{ matrix.app }}" | tee "$RUNNER_TEMP/ship.log"
          echo "Started ship-mac for ${{ matrix.app }}: Actions > ship-mac shows the build and TestFlight upload." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish an over-the-air update
        if: steps.rel.outputs.mode == 'update'
        run: |
          set -o pipefail
          eas update --channel production --platform ios --non-interactive --message "${{ steps.rel.outputs.note }}" 2>&1 | tee "$RUNNER_TEMP/ship.log"

      - name: Report a failure on the commit (readable without the Actions page)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '**ship (%s) failed.** Last lines:\n\n```\n%s\n```\n' "${{ matrix.app }}" "$( (awk 'length($0) < 400' "$RUNNER_TEMP/ship.log" | tail -n 50) 2>/dev/null || echo 'no log (failed before the build step)')")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" > /dev/null

      - name: Summary
        run: |
          echo "### ${{ matrix.app }}: ${{ steps.rel.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.rel.outputs.note }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.rel.outputs.mode }}" = "build" ]; then echo "Build and TestFlight upload: Actions > ship-mac." >> "$GITHUB_STEP_SUMMARY"; fi
