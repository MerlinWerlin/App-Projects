name: Glaze native photo album
on:
  push:
    branches: ['codex/glaze-theme-release-20261101']
    paths: ['apps/glaze/targets/widget/PhotoAlbum*.swift', 'apps/glaze/modules/glaze-widget-bridge/ios/AlbumPhotoImport.swift', 'apps/glaze/scripts/*native-album*', '.github/workflows/glaze-native-album.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  album:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/glaze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate editor fixtures and compile the actual native importer and widget
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GlazeAlbumReview.app"
          mkdir -p "$APP"
          node --no-warnings scripts/prepare-native-album-review.mjs "$APP/native-album-review.json"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SOURCES=()
          for FILE in targets/widget/*.swift; do
            if [[ "$FILE" != targets/widget/GlazeWidgetsBundle.swift ]]; then SOURCES+=("$FILE"); fi
          done
          xcrun swiftc -parse-as-library -sdk "$SDK" -target "$(uname -m)-apple-ios17.0-simulator" "${SOURCES[@]}" modules/glaze-widget-bridge/ios/AlbumPhotoImport.swift scripts/native-album-review.swift -o "$APP/GlazeAlbumReview" > "$RUNNER_TEMP/glaze-album-compile.log" 2>&1 || { tail -120 "$RUNNER_TEMP/glaze-album-compile.log"; exit 1; }
          cp -R targets/widget/*.lproj "$APP/"
          python3 - <<'PY'
          import os,pathlib,plistlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'GlazeAlbumReview.app'
          info={'CFBundleIdentifier':'com.glaze.album-review','CFBundleExecutable':'GlazeAlbumReview','CFBundleName':'GlazeAlbumReview','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'17.0','UIDeviceFamily':[1],'LSRequiresIPhoneOS':True,'UILaunchScreen':{},'CFBundleDevelopmentRegion':'en','ReviewSourceSHA':os.environ['GITHUB_SHA']}
          (app/'Info.plist').write_bytes(plistlib.dumps(info))
          PY
          codesign --force --sign - "$APP"
      - name: Verify imports, rotation, cursor persistence and native layouts in eleven languages
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/GlazeAlbumReview.app"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.album-review data)
          SOURCE="$DATA/Library/Caches/GlazeAlbumReview"
          for LANGUAGE in ar de en es fr hi it ja ko pt-BR zh-Hans; do
            xcrun simctl terminate "$DEVICE" com.glaze.album-review >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE" com.glaze.album-review -AppleLanguages "($LANGUAGE)" --language "$LANGUAGE"
            for TRY in $(seq 1 120); do
              if [[ -f "$SOURCE/$LANGUAGE/_ALBUM_SUCCESS.json" || -f "$SOURCE/$LANGUAGE/_ERROR.txt" ]]; then break; fi
              sleep 1
            done
            if [[ -f "$SOURCE/$LANGUAGE/_ERROR.txt" ]]; then cat "$SOURCE/$LANGUAGE/_ERROR.txt"; exit 1; fi
            test -f "$SOURCE/$LANGUAGE/_ALBUM_SUCCESS.json"
          done
      - name: Preserve original native receipts and screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/glaze-native-album-review"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.album-review data 2>/dev/null || true)
          if [[ -n "$DATA" && -d "$DATA/Library/Caches/GlazeAlbumReview" ]]; then cp -R "$DATA/Library/Caches/GlazeAlbumReview/." "$RUNNER_TEMP/glaze-native-album-review/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-native-album-review
          path: |
            ${{ runner.temp }}/glaze-native-album-review
            ${{ runner.temp }}/glaze-album-compile.log
          retention-days: 14
