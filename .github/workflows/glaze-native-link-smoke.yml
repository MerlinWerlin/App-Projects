name: Glaze installed Widgets link
on:
  push:
    branches: ['codex/glaze-theme-release-20261101']
    paths: ['.github/workflows/glaze-native-link-smoke.yml']
  workflow_dispatch:
    inputs:
      simulator_run:
        description: 'Full native run containing glaze-simulator-installable; blank compiles the test runner only'
        required: false
        default: ''
        type: string
      previous_simulator_run:
        description: 'Optional 1.0.4 simulator app for an in-place upgrade before the theme gallery test'
        required: false
        default: ''
        type: string
      scenario:
        description: 'Installed route or actual Home Screen widget and shared-data round trip'
        type: choice
        options: [route, widget, album, album-widget, design, alpine, alpine-home, alpine-art, theme-gallery]
        default: route
permissions:
  contents: read
  actions: read
jobs:
  link:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 42
    env:
      GH_TOKEN: ${{ github.token }}
      GLAZE_SIMULATOR_RUN: ${{ inputs.simulator_run }}
      GLAZE_PREVIOUS_SIMULATOR_RUN: ${{ inputs.previous_simulator_run }}
      GLAZE_UI_SCENARIO: ${{ inputs.scenario || 'route' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build a small XCTest runner without rebuilding Expo
        working-directory: apps/glaze
        run: |
          set -euo pipefail
          FIXTURE=native-link-ui-tests.swift
          if [[ "$GLAZE_UI_SCENARIO" == widget ]]; then FIXTURE=native-widget-tap-tests.swift; fi
          if [[ "$GLAZE_UI_SCENARIO" == design || "$GLAZE_UI_SCENARIO" == alpine || "$GLAZE_UI_SCENARIO" == alpine-home || "$GLAZE_UI_SCENARIO" == alpine-art || "$GLAZE_UI_SCENARIO" == theme-gallery ]]; then FIXTURE=native-designed-widget-ui-tests.swift; fi
          if [[ "$GLAZE_UI_SCENARIO" == album || "$GLAZE_UI_SCENARIO" == album-widget ]]; then FIXTURE=native-album-ui-tests.swift; fi
          ruby scripts/prepare-native-link-test.rb "$RUNNER_TEMP/GlazeLinkCheck" "$FIXTURE" "$GLAZE_UI_SCENARIO"
          xcodebuild -project "$RUNNER_TEMP/GlazeLinkCheck/GlazeLinkCheck.xcodeproj" -scheme GlazeLinkCheck -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/link-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing > "$RUNNER_TEMP/glaze-link-build.log" 2>&1 || { tail -120 "$RUNNER_TEMP/glaze-link-build.log"; exit 1; }
      - name: Retrieve the exact previously built simulator app
        if: inputs.simulator_run != ''
        run: |
          set -euo pipefail
          RUN="$GLAZE_SIMULATOR_RUN"
          [[ "$RUN" =~ ^[0-9]+$ ]]
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n glaze-simulator-installable -D "$RUNNER_TEMP/installable"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha > "$RUNNER_TEMP/installable/run-source.txt"
          python3 - <<'PY'
          import os,pathlib,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'installable'
          receipt=json.loads((root/'simulator-app-source.json').read_text())
          assert receipt['sourceSHA']==(root/'run-source.txt').read_text().strip()
          assert receipt['bundleId']=='com.jared797.glaze' and receipt['bundledJavaScript'] and receipt['unsignedSimulatorOnly']
          PY
          ditto -x -k "$RUNNER_TEMP/installable/glaze-simulator-app.zip" "$RUNNER_TEMP/installable"
          if [[ -n "$GLAZE_PREVIOUS_SIMULATOR_RUN" ]]; then
            [[ "$GLAZE_PREVIOUS_SIMULATOR_RUN" =~ ^[0-9]+$ && "$GLAZE_UI_SCENARIO" == theme-gallery ]]
            gh run download "$GLAZE_PREVIOUS_SIMULATOR_RUN" --repo "$GITHUB_REPOSITORY" -n glaze-simulator-installable -D "$RUNNER_TEMP/previous"
            ditto -x -k "$RUNNER_TEMP/previous/glaze-simulator-app.zip" "$RUNNER_TEMP/previous"
          fi
      - name: Install the real app and verify the Widgets route through the system prompt
        if: inputs.simulator_run != ''
        timeout-minutes: 34
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/installable" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          codesign --force --deep --sign - "$APP"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          PROJECT="$RUNNER_TEMP/GlazeLinkCheck/GlazeLinkCheck.xcodeproj"
          ARGS=(-project "$PROJECT" -scheme GlazeLinkCheck -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/link-build" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if [[ -n "$GLAZE_PREVIOUS_SIMULATOR_RUN" ]]; then
            PREVIOUS=$(find "$RUNNER_TEMP/previous" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$PREVIOUS"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PREVIOUS/Info.plist")" = 1.0.4
            codesign --force --deep --sign - "$PREVIOUS"
            xcrun simctl install "$DEVICE" "$PREVIOUS"
            xcodebuild "${ARGS[@]}" -resultBundlePath "$RUNNER_TEMP/glaze-upgrade-before.xcresult" -only-testing:GlazeLinkUITests/GlazeDesignedWidgetUITests/testAlpineOnHomeScreen test-without-building > "$RUNNER_TEMP/glaze-upgrade-before.log" 2>&1 || { tail -160 "$RUNNER_TEMP/glaze-upgrade-before.log"; exit 1; }
            grep -F GLAZE_ALPINE_INSTALLED "$RUNNER_TEMP/glaze-upgrade-before.log"
          fi
          xcrun simctl install "$DEVICE" "$APP"
          if [[ -n "$GLAZE_PREVIOUS_SIMULATOR_RUN" ]]; then
            mkdir -p "$RUNNER_TEMP/glaze-native-link-review"
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/glaze-native-link-review/immediately-after-upgrade.png"
          fi
          if [[ "$GLAZE_UI_SCENARIO" == album || "$GLAZE_UI_SCENARIO" == album-widget ]]; then
            python3 - <<'PY'
          import os,pathlib,struct,zlib,binascii
          def chunk(tag,data):return struct.pack('>I',len(data))+tag+data+struct.pack('>I',binascii.crc32(tag+data)&0xffffffff)
          for name,colour in [('first',bytes([0,160,170])),('second',bytes([240,120,20]))]:
              row=b'\0'+colour*1600
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1600,1000,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(row*1000))+chunk(b'IEND',b'')
              (pathlib.Path(os.environ['RUNNER_TEMP'])/('glaze-picker-'+name+'.png')).write_bytes(png)
          PY
            xcrun simctl addmedia "$DEVICE" "$RUNNER_TEMP/glaze-picker-first.png" "$RUNNER_TEMP/glaze-picker-second.png"
          fi
          TEST=GlazeLinkUITests/GlazeDeepLinkTests/testWidgetLinkReachesWidgets
          if [[ "$GLAZE_UI_SCENARIO" == widget ]]; then TEST=GlazeLinkUITests/GlazeWidgetTapTests/testWidgetTapRoundTripsThroughSharedStorage; fi
          if [[ "$GLAZE_UI_SCENARIO" == design ]]; then TEST=GlazeLinkUITests/GlazeDesignedWidgetUITests/testThreeFunctionalDesignsReachSharedStorage; fi
          if [[ "$GLAZE_UI_SCENARIO" == alpine ]]; then TEST=GlazeLinkUITests/GlazeDesignedWidgetUITests/testAlpineOriginalFaceFromTheme; fi
          if [[ "$GLAZE_UI_SCENARIO" == alpine-home ]]; then TEST=GlazeLinkUITests/GlazeDesignedWidgetUITests/testAlpineOnHomeScreen; fi
          if [[ "$GLAZE_UI_SCENARIO" == alpine-art ]]; then TEST=GlazeLinkUITests/GlazeDesignedWidgetUITests/testAlpineSmallEditWidgetArt; fi
          if [[ "$GLAZE_UI_SCENARIO" == theme-gallery ]]; then TEST=GlazeLinkUITests/GlazeDesignedWidgetUITests/testThemeGalleryWithoutSavingIndividualWidgets; fi
          if [[ "$GLAZE_UI_SCENARIO" == album || "$GLAZE_UI_SCENARIO" == album-widget ]]; then TEST=GlazeLinkUITests/GlazeAlbumPickerTests/testSelectedPhotosReachNativeAlbum; fi
          xcodebuild "${ARGS[@]}" -resultBundlePath "$RUNNER_TEMP/glaze-link.xcresult" "-only-testing:$TEST" test-without-building > "$RUNNER_TEMP/glaze-link-test.log" 2>&1 &
          LINK_PID=$!
          if [[ "$GLAZE_UI_SCENARIO" != route ]]; then
            if ! wait "$LINK_PID"; then tail -160 "$RUNNER_TEMP/glaze-link-test.log"; exit 1; fi
            if [[ "$GLAZE_UI_SCENARIO" == album || "$GLAZE_UI_SCENARIO" == album-widget ]]; then
              grep -F GLAZE_ALBUM_PICKER_DELIVERED "$RUNNER_TEMP/glaze-link-test.log"
              if [[ "$GLAZE_UI_SCENARIO" == album-widget ]]; then grep -F GLAZE_ALBUM_INSTALLED_NEXT_VERIFIED "$RUNNER_TEMP/glaze-link-test.log"; fi
            elif [[ "$GLAZE_UI_SCENARIO" == design ]]; then
              grep -F GLAZE_DESIGNED_WIDGETS_BRIDGE_VERIFIED "$RUNNER_TEMP/glaze-link-test.log"
            elif [[ "$GLAZE_UI_SCENARIO" == alpine-art ]]; then
              grep -F GLAZE_ALPINE_SMALL_ART_OPTIONS_VERIFIED "$RUNNER_TEMP/glaze-link-test.log"
            elif [[ "$GLAZE_UI_SCENARIO" == alpine-home ]]; then
              grep -F GLAZE_ALPINE_INSTALLED "$RUNNER_TEMP/glaze-link-test.log"
            elif [[ "$GLAZE_UI_SCENARIO" == theme-gallery ]]; then
              grep -F GLAZE_THEME_GALLERY_INSTALLED "$RUNNER_TEMP/glaze-link-test.log"
            elif [[ "$GLAZE_UI_SCENARIO" == alpine ]]; then
              grep -F GLAZE_ALPINE_CLOCK_SAVED "$RUNNER_TEMP/glaze-link-test.log"
            else
              grep -F GLAZE_WIDGET_TAP_BRIDGE_VERIFIED "$RUNNER_TEMP/glaze-link-test.log"
            fi
            grep -F '** TEST EXECUTE SUCCEEDED **' "$RUNNER_TEMP/glaze-link-test.log"
            exit 0
          fi
          READY=0
          for TRY in $(seq 1 360); do
            RUNNER_DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.link-ui-tests.xctrunner data 2>/dev/null || true)
            if [[ -n "$RUNNER_DATA" && -f "$RUNNER_DATA/Library/Caches/glaze-deeplink-ready" ]] || grep -q GLAZE_DEEPLINK_READY "$RUNNER_TEMP/glaze-link-test.log"; then READY=1; break; fi
            if ! kill -0 "$LINK_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$READY" != 1 ]]; then wait "$LINK_PID" || true; tail -120 "$RUNNER_TEMP/glaze-link-test.log"; exit 1; fi
          xcrun simctl openurl "$DEVICE" glaze://widgets
          if ! wait "$LINK_PID"; then tail -160 "$RUNNER_TEMP/glaze-link-test.log"; exit 1; fi
          grep -F GLAZE_WIDGETS_ROUTE_VERIFIED "$RUNNER_TEMP/glaze-link-test.log"
          grep -F '** TEST EXECUTE SUCCEEDED **' "$RUNNER_TEMP/glaze-link-test.log"
          grep -F 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/glaze-link-test.log"
      - name: Export original XCTest attachments and source receipt
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/glaze-native-link-review"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          python3 apps/glaze/scripts/snapshot-native-test-group.py "$DEVICE" "$RUNNER_TEMP/glaze-native-link-review/shared-group" || true
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/glaze-native-link-review/last-screen.png" || true
          if [[ -d "$RUNNER_TEMP/glaze-link.xcresult" ]]; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/glaze-link.xcresult" --output-path "$RUNNER_TEMP/glaze-native-link-review/attachments" > "$RUNNER_TEMP/glaze-native-link-review/attachment-export.log" 2>&1 || true; fi
          if [[ -d "$RUNNER_TEMP/glaze-upgrade-before.xcresult" ]]; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/glaze-upgrade-before.xcresult" --output-path "$RUNNER_TEMP/glaze-native-link-review/before-upgrade" || true; fi
          if [[ "$GLAZE_UI_SCENARIO" == alpine-home || "$GLAZE_UI_SCENARIO" == alpine-art || "$GLAZE_UI_SCENARIO" == theme-gallery ]]; then xcrun simctl spawn "$DEVICE" log show --last 12m --info --debug --style compact --predicate '(process CONTAINS[c] "GlazeWidget" OR subsystem CONTAINS[c] "WidgetKit") AND (eventMessage CONTAINS[c] "glaze" OR eventMessage CONTAINS[c] "image" OR eventMessage CONTAINS[c] "archiv")' > "$RUNNER_TEMP/glaze-native-link-review/widget-os.log" || true; fi
          cp "$RUNNER_TEMP/installable/simulator-app-source.json" "$RUNNER_TEMP/glaze-native-link-review/" || true
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'glaze-native-link-review'
          log=pathlib.Path(os.environ['RUNNER_TEMP'])/'glaze-link-test.log'
          text=log.read_text() if log.exists() else ''
          package=pathlib.Path(os.environ['RUNNER_TEMP'])/'installable/glaze-simulator-app.zip'
          execute_ok=any(marker in text for marker in ['** TEST SUCCEEDED **','** TEST EXECUTE SUCCEEDED **'])
          routed='GLAZE_WIDGETS_ROUTE_VERIFIED' in text and execute_ok and 'Executed 1 test, with 0 failures' in text
          supplied=bool(os.environ.get('GLAZE_SIMULATOR_RUN',''))
          widget='GLAZE_WIDGET_TAP_BRIDGE_VERIFIED' in text and execute_ok and 'Executed 1 test, with 0 failures' in text
          album='GLAZE_ALBUM_PICKER_DELIVERED' in text and execute_ok and 'Executed 1 test, with 0 failures' in text
          receipt={'harnessSourceSHA':os.environ['GITHUB_SHA'],'simulatorRun':os.environ.get('GLAZE_SIMULATOR_RUN',''),'simulatorZipSHA256':hashlib.sha256(package.read_bytes()).hexdigest() if package.exists() else None,'runnerBuildOnly':not supplied,'scenario':os.environ.get('GLAZE_UI_SCENARIO','route'),'routeTestPassed':supplied and routed,'installedWidgetTapTest':supplied and widget,'fullExpoHabitBridgeQualifiedInSimulator':supplied and widget,'physicalDeviceTest':False,'scope':'Actual app/WidgetKit UI and shared-data round trip in simulator' if widget else ('Real installed Expo app URL test only; no widget tap/full habit bridge qualification' if supplied else 'Compile-only XCTest runner')}
          receipt['systemAlbumPickerUITest']=supplied and album
          design='GLAZE_DESIGNED_WIDGETS_BRIDGE_VERIFIED' in text and execute_ok and 'Executed 1 test, with 0 failures' in text
          receipt['designedWidgetSaveUITest']=supplied and design
          if design:
              index=json.loads((root/'shared-group/index.json').read_text())
              kinds={p.get('live',{}).get('design',{}).get('kind') for p in index.get('pieces',[])}
              assert {'clock','battery','calendar'}<=kinds
              assert all(p['live']['rect']==[0,0,1,1] for p in index['pieces'] if p.get('live',{}).get('design'))
              receipt['designedWidgetSharedSpecsVerified']=True
              receipt['scope']='Real installed Expo app selects and saves all three functional widget designs through the native bridge; shared semantic specs survive app restart. Home Screen interaction/physical phone not inferred.'
          alpine='GLAZE_ALPINE_CLOCK_SAVED' in text and execute_ok and 'Executed 1 test, with 0 failures' in text
          receipt['alpineClockSaveUITest']=supplied and alpine
          receipt['alpineSmallEditWidgetArt']=supplied and execute_ok and 'GLAZE_ALPINE_SMALL_ART_OPTIONS_VERIFIED' in text
          receipt['alpineInstalledThroughPicker']=supplied and 'GLAZE_ALPINE_INSTALLED' in text and execute_ok
          receipt['themeGalleryInstalledThroughPicker']=supplied and 'GLAZE_THEME_GALLERY_INSTALLED' in text and execute_ok
          if receipt['themeGalleryInstalledThroughPicker']:
              theme=json.loads((root/'shared-group/theme.json').read_text())
              assert theme['themeId']=='alpine-starlight'
              assert {d['kind'] for d in theme['designs']}=={'clock','battery','calendar'}
              assert all(d['identity']['originalFace']=='alpine' for d in theme['designs'])
              receipt['scope']='The installed app applies Alpine Starlight without saving individual widgets and the system gallery installs each of the three designed widget kinds.'
              if os.environ.get('GLAZE_PREVIOUS_SIMULATOR_RUN'):
                  index=json.loads((root/'shared-group/index.json').read_text())
                  assert any(p.get('themeId')=='alpine-starlight' and p.get('live',{}).get('design',{}).get('kind')=='clock' for p in index['pieces'])
                  receipt['installedOverVersion104']=True
          if alpine:
              index=json.loads((root/'shared-group/index.json').read_text())
              clock=next(p for p in index['pieces'] if p.get('themeId')=='alpine-starlight' and p.get('live',{}).get('design',{}).get('kind')=='clock')
              assert clock['live']['design']['identity']['originalFace']=='alpine'
              receipt['alpineOriginalFaceSpecVerified']=True
              receipt['scope']='Real installed app opens Alpine Starlight from the live catalogue and saves its original clock face through the shared bridge.'
          album_next='GLAZE_ALBUM_INSTALLED_NEXT_VERIFIED' in text and album
          receipt['installedAlbumNextTest']=supplied and album_next
          receipt['installedAlbumCursorVerified']=False
          receipt['albumSharedManifestVerified']=False
          if album:
              manifest=json.loads((root/'shared-group/widgets.json').read_text())
              capture=json.loads((root/'shared-group/group-capture.json').read_text())
              photos=next(s['photoRefs'] for s in manifest['catalogue']['specs'] if s['kind']=='photoAlbum' and s['size']=='medium')
              receipt['albumSharedManifestVerified']=len(photos)==2 and len(capture.get('albumImages',[]))==2 and all(i['contentHashMatches'] and i['jpeg'] and i['bytes']<=2*1024*1024 for i in capture['albumImages'])
              assert receipt['albumSharedManifestVerified']
              receipt['scope']='Actual system album picker, durable draft and full Expo native bridge to verified shared JPEGs/manifest; no installed album Next button qualification'
              if album_next:
                  design=next(s for s in manifest['catalogue']['specs'] if s['kind']=='photoAlbum' and s['size']=='medium')
                  key=hashlib.sha256((design['id'][:200]+'|'+'|'.join(photos)).encode()).hexdigest()
                  receipt['installedAlbumCursorVerified']=any(c['file']=='album-cursor-'+key+'.json' and c['offset']==1 for c in capture.get('albumCursors',[]))
                  assert receipt['installedAlbumCursorVerified']
                  receipt['scope']='Actual system Photos selection, full Expo album delivery and installed Home Screen Next button; selected image visibly changes without app launch and the matching shared cursor is1. Simulator only.'
          (root/'link-receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-native-link-review
          path: |
            ${{ runner.temp }}/glaze-native-link-review
            ${{ runner.temp }}/glaze-link-build.log
            ${{ runner.temp }}/glaze-link-test.log
            ${{ runner.temp }}/glaze-upgrade-before.log
          retention-days: 14
