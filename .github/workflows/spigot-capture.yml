name: Spigot capture
# Spigot on the newest Xcode (iOS 27 SDK) in an iOS 27 iPhone Pro Max simulator: builds an unsigned Release
# simulator app with EXPO_PUBLIC_SPIGOT_CAPTURE=1 (tools unlocked, paywall shows the A$ list price, no App Store),
# checks it is still running 30 s after launch (UIScene / iOS 27 launch check), then types real values through the
# keypad with Maestro (scripts/capture-flow.yaml) and keeps every screenshot as an artifact. Light and dark runs.
# Simulator only: no signing, nothing shipped.
on:
  workflow_dispatch:
  push:
    branches: ['claude/plumber-app']
    paths: ['apps/spigot/**', '.github/workflows/spigot-capture.yml']
permissions:
  contents: read
concurrency:
  group: spigot-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/spigot
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Select Xcode and install Maestro
        run: |
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version; echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          curl -fLsS https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          curl -fLsS https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/checksums_sha256.txt -o "$RUNNER_TEMP/checksums_sha256.txt"
          (cd "$RUNNER_TEMP" && grep 'maestro.zip' checksums_sha256.txt | shasum -a 256 -c -)
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/m"
          echo "$RUNNER_TEMP/m/maestro/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Tests
        run: npx jest
      - name: Prebuild
        run: |
          npx expo prebuild --platform ios --no-install > "$RUNNER_TEMP/prebuild.log" 2>&1 || { tail -80 "$RUNNER_TEMP/prebuild.log"; exit 1; }
          for f in $(find ios -maxdepth 2 -name Info.plist); do echo "$f"; /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$f" 2>&1 || true; done
          cd ios && pod install > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -100 "$RUNNER_TEMP/pods.log"; exit 1; }
      - name: Build the simulator app (capture flag)
        env:
          EXPO_PUBLIC_SPIGOT_CAPTURE: '1'
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -40; tail -150 "$RUNNER_TEMP/build.log"; exit 1; }
          ls "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator/"
      - name: Launch check and captures
        timeout-minutes: 50
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/derived/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          DEVICE=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          ds=[x for rt,xs in sorted(d.items(),reverse=True) if 'iOS' in rt for x in xs]
          p=next((x for x in ds if 'Pro Max' in x['name']),None) or next(x for x in ds if 'iPhone' in x['name'])
          print(p['udid'])
          PY
          )
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl launch "$DEVICE" com.jared797.spigot; sleep 30
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q "com.jared797.spigot" && echo "LAUNCH CHECK: still running after 30 s" | tee "$RUNNER_TEMP/shots/launch-check.txt" || { echo "::error::Spigot is not running 30 s after launch"; exit 1; }
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/shots/launch.png"
          xcrun simctl terminate "$DEVICE" com.jared797.spigot || true
          RESULT=0
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance $MODE
            mkdir -p "$RUNNER_TEMP/shots/$MODE"
            MAESTRO_CLI_NO_ANALYTICS=1 MAESTRO_DRIVER_STARTUP_TIMEOUT=240000 maestro --device "$DEVICE" test --test-output-dir "$RUNNER_TEMP/shots/$MODE" --debug-output "$RUNNER_TEMP/shots/$MODE/debug" scripts/capture-flow.yaml || RESULT=1
            find . -maxdepth 1 -name '*.png' -exec mv {} "$RUNNER_TEMP/shots/$MODE/" \;
          done
          exit $RESULT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spigot-captures
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/build.log
          retention-days: 14
