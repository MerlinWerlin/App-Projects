name: Cue Android signed local build
on:
  push:
    branches: [codex/cue-android-review-access-20261105]
    paths: ['.github/workflows/cue-play-local-production.yml']
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Optional existing signed-local-build artifact to inspect without rebuilding
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLAY_VARIANT: production
      EAS_BUILD_PLATFORM: android
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.artifact_run_id == ''
        with:
          ref: 1290bdf42acaf5f2bd216f5443b4a83e31001d5f
          path: frozen-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Bind exact source and test validation gates
        if: inputs.artifact_run_id == ''
        run: |
          test -n "$EXPO_TOKEN"
          mkdir cue-play-local-production-output
          git -C frozen-source rev-parse HEAD > cue-play-local-production-output/source-commit.txt
          test "$(cat cue-play-local-production-output/source-commit.txt)" = '1290bdf42acaf5f2bd216f5443b4a83e31001d5f'
          python -B -m unittest discover -s scripts/play -p 'test_*.py'
      - name: Install frozen source
        if: inputs.artifact_run_id == ''
        working-directory: frozen-source/apps/cue
        run: npm ci --no-audit --no-fund
      - name: Link existing project and freeze Android version
        if: inputs.artifact_run_id == ''
        working-directory: frozen-source/apps/cue
        run: |
          eas init --id 6a599954-54e2-4010-b7ff-54640715ff1a --non-interactive --force
          node -e 'const fs=require("fs");const p="eas.json",e=require("./eas.json");e.build["play-production"].autoIncrement=false;fs.writeFileSync(p,JSON.stringify(e,null,2)+"\n")'
          npx expo config --type public --json > ../../../cue-play-local-production-output/config.json
          node -e 'const c=require("../../../cue-play-local-production-output/config.json");if(c.android.package!=="com.jared797.cue"||c.updates.enabled!==false||c.extra.playVariant!=="production")throw Error("Wrong Android production config")'
          git diff -- app.json eas.json > ../../../cue-play-local-production-output/ci-config-delta.diff
          git diff --exit-code -- . ':!app.json' ':!eas.json'
      - name: Build signed Android AAB with existing managed credentials
        if: inputs.artifact_run_id == ''
        working-directory: frozen-source/apps/cue
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/cue-eas-local-work
        run: eas build --local --platform android --profile play-production --non-interactive --output "$GITHUB_WORKSPACE/cue-play-local-production-output/cue-production.aab"
      - uses: actions/download-artifact@v4
        if: inputs.artifact_run_id != ''
        with:
          name: cue-play-local-production
          path: cue-play-local-production-output
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Inspect signed bundle using the common production gates
        env:
          BUILD_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python scripts/play/verify_local_aab.py cue-play-local-production-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cue-play-local-production
          path: cue-play-local-production-output/
          if-no-files-found: ignore
          retention-days: 14
