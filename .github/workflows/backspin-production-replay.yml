name: Backspin production bundle gameplay

on:
  workflow_call:
    inputs:
      bundleRun:
        required: true
        type: string
      pageSize:
        type: string
        default: '4096'
      apiLevel:
        type: string
        default: '35'
      emulatorVersion:
        type: string
        default: sdk-current
      emulatorProfile:
        type: string
        default: standard
      microphoneSource:
        type: string
        default: host-speech
  workflow_dispatch:
    inputs:
      bundleRun:
        description: Successful Backspin native/gameplay/AAB run to replay
        required: true
        type: string
      pageSize:
        type: choice
        default: '4096'
        options: ['4096', '16384']
      apiLevel:
        type: choice
        default: '35'
        options: ['35', '36']
      emulatorVersion:
        type: choice
        default: sdk-current
        options: ['sdk-current', '36.6.11']
      emulatorProfile:
        type: choice
        default: standard
        options: ['standard', 'low-load']
      microphoneSource:
        type: choice
        default: host-speech
        options: ['host-speech', 'hal-tone']

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      APP: backspin
      BACKSPIN_PRODUCTION_REPLAY: '1'
      ANDROID_PAGE_SIZE: ${{ inputs.pageSize }}
      ANDROID_API_LEVEL: ${{ inputs.apiLevel }}
      EMULATOR_VERSION: ${{ inputs.emulatorVersion }}
      ANDROID_EMULATOR_PROFILE: ${{ inputs.emulatorProfile }}
      BACKSPIN_MICROPHONE_SOURCE: ${{ inputs.microphoneSource }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Retrieve and verify the actual production bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RUN: ${{ inputs.bundleRun }}
        run: |
          [[ "$BUNDLE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$BUNDLE_RUN" --json conclusion --jq .conclusion)" = success
          gh run download "$BUNDLE_RUN" -n backspin-unsigned-production-bundle -D aab-output
          APK_SOURCE="$(cat aab-output/source-commit.txt)"
          [[ "$APK_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$APK_SOURCE"
          git diff --exit-code "$APK_SOURCE" HEAD -- apps/backspin ':!apps/backspin/docs/**' ':!apps/backspin/store/**' ':!apps/backspin/README.md' ':!apps/backspin/ops/RUNLOG.md'
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('aab-output/backspin-UNSIGNED.aab')
          receipt=json.loads(Path('aab-output/receipt.json').read_text())
          config=json.loads(Path('aab-output/config.json').read_text())
          assert receipt['status']=='UNSIGNED_NOT_UPLOADABLE'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==receipt['sha256']
          assert config['android']['package']=='com.jared797.backspin' and config['updates']['enabled'] is False
          PY
      - name: Generate an isolated test-signed APK from the production bundle
        run: |
          curl --fail --location --retry 2 --output /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/bundletool.jar' | sha256sum --check
          java -Xmx256m -jar /tmp/bundletool.jar validate --bundle=aab-output/backspin-UNSIGNED.aab
          test "$(java -Xmx256m -jar /tmp/bundletool.jar dump manifest --bundle=aab-output/backspin-UNSIGNED.aab --xpath=/manifest/@package)" = com.jared797.backspin
          keytool -genkeypair -keystore "$RUNNER_TEMP/replay.jks" -storepass android -keypass android -alias replay -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Ephemeral CI gameplay only'
          java -Xmx512m -jar /tmp/bundletool.jar build-apks --bundle=aab-output/backspin-UNSIGNED.aab --output=/tmp/production.apks --mode=universal --ks="$RUNNER_TEMP/replay.jks" --ks-pass=pass:android --ks-key-alias=replay --key-pass=pass:android
          mkdir -p apk-output
          unzip -p /tmp/production.apks universal.apk > apk-output/backspin-production-replay.apk
          cp aab-output/config.json aab-output/source-commit.txt apk-output/
          cp aab-output/receipt.json apk-output/source-bundle-receipt.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apk-output/backspin-production-replay.apk > apk-output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk-output/backspin-production-replay.apk > apk-output/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree apk-output/backspin-production-replay.apk AndroidManifest.xml > apk-output/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 apk-output/backspin-production-replay.apk > apk-output/zipalign.txt
          python scripts/play/backspin_test_scope.py --self-test
          python scripts/play/verify_apk.py apk-output/backspin-production-replay.apk apk-output
      - name: Install emulator audio and UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng pulseaudio pulseaudio-utils xvfb xauth libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install 'uiautomator2==3.4.2'
          bash scripts/play/select-backspin-emulator.sh
      - name: Exercise the actual production package on a fresh emulator
        run: bash scripts/play/smoke-apk.sh apk-output/backspin-production-replay.apk apk-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backspin-production-replay-evidence
          path: apk-output/
          if-no-files-found: ignore
          retention-days: 30
