name: Glaze native habit layouts
on:
  push:
    branches: ['codex/glaze-theme-release-20261101']
    paths: ['apps/glaze/scripts/native-habit-review.swift', 'apps/glaze/docs/native-habit-review-profiles.json', 'apps/glaze/targets/widget/HabitWidget.swift', 'apps/glaze/targets/widget/ThemeStore.swift', 'apps/glaze/targets/widget/SavedWidgetView.swift', '.github/workflows/glaze-native-habit-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual habit widget views in the isolated simulator host
        working-directory: apps/glaze
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GlazeHabitReview.app"
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          SOURCES=()
          for FILE in targets/widget/*.swift; do
            if [[ "$FILE" != "targets/widget/GlazeWidgetsBundle.swift" ]]; then SOURCES+=("$FILE"); fi
          done
          xcrun swiftc -parse-as-library -sdk "$SDK" -target "$ARCH-apple-ios17.0-simulator" "${SOURCES[@]}" scripts/native-habit-review.swift -o "$APP/GlazeHabitReview" > "$RUNNER_TEMP/glaze-habit-compile.log" 2>&1 || { tail -100 "$RUNNER_TEMP/glaze-habit-compile.log"; exit 1; }
          cp docs/native-habit-review-profiles.json "$APP/"
          cp -R targets/widget/*.lproj "$APP/"
          python3 - <<'PY'
          import os,plistlib,pathlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'GlazeHabitReview.app'
          info={'CFBundleIdentifier':'com.glaze.habit-review','CFBundleExecutable':'GlazeHabitReview','CFBundleName':'GlazeHabitReview','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'17.0','UIDeviceFamily':[1],'LSRequiresIPhoneOS':True,'UILaunchScreen':{},'UIApplicationSceneManifest':{'UIApplicationSupportsMultipleScenes':False},'ReviewSourceSHA':os.environ['GITHUB_SHA']}
          (app/'Info.plist').write_bytes(plistlib.dumps(info))
          PY
          codesign --force --sign - "$APP"
      - name: Capture all105 theme palettes and habit value states
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/GlazeHabitReview.app"
          xcrun simctl launch "$DEVICE" com.glaze.habit-review
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.habit-review data)
          SOURCE="$DATA/Library/Caches/GlazeHabitReview"
          for TRY in $(seq 1 240); do
            if [[ -f "$SOURCE/_HABIT_SUCCESS.json" || -f "$SOURCE/_ERROR.txt" ]]; then break; fi
            sleep 2
          done
          mkdir -p "$RUNNER_TEMP/glaze-native-habit-review"
          if [[ -d "$SOURCE" ]]; then cp -R "$SOURCE/." "$RUNNER_TEMP/glaze-native-habit-review/"; fi
          if [[ -f "$SOURCE/_ERROR.txt" ]]; then cat "$SOURCE/_ERROR.txt"; exit 1; fi
          test -f "$SOURCE/_HABIT_SUCCESS.json"
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"glaze-native-habit-review/_HABIT_SUCCESS.json").read_text()); assert r["themes"]==105 and r["renders"]==2520; print("Verified2520 actual native habit layouts; touch/device tests remain separate")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-native-habit-review
          path: |
            ${{ runner.temp }}/glaze-native-habit-review
            ${{ runner.temp }}/glaze-habit-compile.log
          retention-days: 14
