name: Glaze native art options
on:
  pull_request:
    paths: ['apps/glaze/targets/widget/WidgetArtLibrary.swift', 'apps/glaze/src/core/remoteWidgetArt.ts', 'apps/glaze/src/core/widgetArtPictureAliases.ts', 'apps/glaze/scripts/native-widget-art-option-*', '.github/workflows/glaze-widget-art-options.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-picker:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/glaze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare live packs and compile the production AppIntents query
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/WidgetArtReview.app"
          mkdir -p "$APP"
          node --no-warnings scripts/native-widget-art-option-fixture.mjs "$APP"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SOURCES=()
          for FILE in targets/widget/*.swift; do
            if [[ "$FILE" != targets/widget/GlazeWidgetsBundle.swift ]]; then SOURCES+=("$FILE"); fi
          done
          xcrun swiftc -parse-as-library -sdk "$SDK" -target "$(uname -m)-apple-ios17.0-simulator" "${SOURCES[@]}" scripts/native-widget-art-option-review.swift -o "$APP/WidgetArtReview"
          python3 - <<'PY'
          import os,pathlib,plistlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'WidgetArtReview.app'
          info={'CFBundleIdentifier':'com.glaze.art-options-review','CFBundleExecutable':'WidgetArtReview','CFBundleName':'WidgetArtReview','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'17.0','UIDeviceFamily':[1],'LSRequiresIPhoneOS':True,'UILaunchScreen':{}}
          (app/'Info.plist').write_bytes(plistlib.dumps(info))
          PY
          codesign --force --sign - "$APP"
      - name: Execute the native query and verify every size on iOS
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/WidgetArtReview.app"
          xcrun simctl launch "$DEVICE" com.glaze.art-options-review
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.glaze.art-options-review data)
          OUT="$DATA/Library/Caches"
          for TRY in $(seq 1 200); do
            if [[ -f "$OUT/widget-art-success.json" || -f "$OUT/widget-art-error.txt" ]]; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/widget-art-option-receipt"
          if [[ -f "$OUT/widget-art-error.txt" ]]; then cat "$OUT/widget-art-error.txt"; cp "$OUT/widget-art-error.txt" "$RUNNER_TEMP/widget-art-option-receipt/"; exit 1; fi
          cp "$OUT/widget-art-success.json" "$RUNNER_TEMP/widget-art-option-receipt/"
          cat "$OUT/widget-art-success.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-native-art-options
          path: ${{ runner.temp }}/widget-art-option-receipt
