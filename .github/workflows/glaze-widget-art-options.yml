name: Glaze native art options
on:
  pull_request:
    paths: ['apps/glaze/**', '.github/workflows/glaze-widget-art-options.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # 1.0.32: 1.0.31 shipped with a type error (Widget Studio read `how` it never declared) because no PR check
  # typechecked Glaze. Every Glaze PR now typechecks (app + node scripts) and runs the full test suite.
  typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/glaze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        if: success() || failure()
        run: npm test
  native-picker:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify every restored production pipeline file
        working-directory: apps/glaze
        run: python3 scripts/verify-widget-art-restore.py
      - name: Run the production recovery reset twice against old state and personal photos
        working-directory: apps/glaze
        run: |
          swiftc -parse-as-library modules/glaze-widget-bridge/ios/WidgetArtRecovery.swift scripts/widget-art-recovery-check.swift -o "$RUNNER_TEMP/widget-art-recovery-check"
          "$RUNNER_TEMP/widget-art-recovery-check"
      - name: Open the original library cleanup during a clean recovery and commit the theme
        working-directory: apps/glaze
        run: node --experimental-strip-types scripts/widget-art-recovery-migration-check.mjs
