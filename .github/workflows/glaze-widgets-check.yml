name: Glaze widget contract
on:
  pull_request:
    paths: ['apps/glaze/targets/widget/**', 'apps/glaze/src/core/widget*.ts', 'apps/glaze/src/core/themedWidgetPreview.ts', 'apps/glaze/src/core/extraordinaryThemeIdentities.ts', 'apps/glaze/theme-sources/**/native-widget-identity.json', 'apps/glaze/scripts/widget-design-*', 'apps/glaze/scripts/widget-ornament-*', 'apps/glaze/scripts/widget-serif-*', '.github/workflows/glaze-widgets-check.yml']
  push:
    branches: ['codex/glaze-theme-retest-20261026']
    paths: ['apps/glaze/**', '.github/workflows/glaze-widgets-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Georgia battery gauge clearance for old and new themes
        working-directory: apps/glaze
        run: |
          npm install --prefix "$RUNNER_TEMP/serif-render" --no-save sharp@0.35.5
          GLAZE_RENDER_MODULES="$RUNNER_TEMP/serif-render" node --no-warnings scripts/widget-serif-preview-check.mjs "$RUNNER_TEMP/serif-review"
      - name: Check actual Apple New York battery gauge clearance
        working-directory: apps/glaze
        run: |
          node scripts/widget-serif-native-probe.mjs "$RUNNER_TEMP/NativeTextProbe.swift"
          swiftc -parse-as-library -target "$(uname -m)-apple-macos14.0" "$RUNNER_TEMP/NativeTextProbe.swift" scripts/widget-serif-native-check.swift -o "$RUNNER_TEMP/serif-native-check"
          "$RUNNER_TEMP/serif-native-check" "$RUNNER_TEMP/serif-review"
      - name: Decode the real editor payload in Swift
        working-directory: apps/glaze
        run: |
          node scripts/widget-design-fixture.mjs "$RUNNER_TEMP/widget-design.json"
          swiftc targets/widget/SavedWidgetDesign.swift scripts/widget-design-check.swift -o "$RUNNER_TEMP/widget-check"
          "$RUNNER_TEMP/widget-check" "$RUNNER_TEMP/widget-design.json"
      - name: Typecheck the whole WidgetKit extension against iOS
        if: always()
        working-directory: apps/glaze
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-ios17.0-simulator targets/widget/*.swift
      - name: Decode real theme companions with the actual Swift identity parser
        working-directory: apps/glaze
        run: |
          node --no-warnings scripts/widget-ornament-fixture.mjs "$RUNNER_TEMP/widget-ornaments.json"
          python3 - <<'PY'
          import os,pathlib
          source=pathlib.Path('targets/widget/ThemedWidgetDrawing.swift').read_text()
          parser=source.split('struct WidgetIdentity {',1)[1].split('\nenum ThemedClockArtwork',1)[0]
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'WidgetIdentity.swift').write_text('import Foundation\nimport SwiftUI\nstruct WidgetIdentity {'+parser)
          PY
          swiftc "$RUNNER_TEMP/WidgetIdentity.swift" scripts/widget-ornament-check.swift -o "$RUNNER_TEMP/widget-ornament-check"
          "$RUNNER_TEMP/widget-ornament-check" "$RUNNER_TEMP/widget-ornaments.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-serif-layout-review
          path: ${{ runner.temp }}/serif-review
          retention-days: 7
