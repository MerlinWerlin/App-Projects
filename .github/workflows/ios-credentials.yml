# One-time iOS signing setup on Expo for a NEW app, with no interactive `eas credentials` and no PC.
# Fixes "Distribution Certificate is not validated for non-interactive builds / Credentials are not set up"
# on an app's first CI build: makes an App Store provisioning profile with the App Store Connect API for the
# team's distribution certificate that Expo already holds (taken from a reference app), uploads it to Expo and
# links both to the new app. Then (optionally) starts the TestFlight build on GitHub's Mac.
name: ios-credentials

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder of the new app (e.g. satchel)'
        required: true
        type: string
      reference:
        description: 'App folder whose Expo distribution certificate to reuse'
        required: false
        default: 'backspin'
        type: string
      build:
        description: 'Start ship-mac for the app afterwards'
        required: false
        default: true
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyjwt cryptography requests

      - name: Names
        id: n
        run: |
          app="${{ inputs.app }}"; ref="${{ inputs.reference }}"
          owner=$(jq -r '.expo.owner' "apps/$app/app.json"); slug=$(jq -r '.expo.slug' "apps/$app/app.json")
          rowner=$(jq -r '.expo.owner' "apps/$ref/app.json"); rslug=$(jq -r '.expo.slug' "apps/$ref/app.json")
          bid=$(jq -r '.expo.ios.bundleIdentifier' "apps/$app/app.json")
          echo "full=@$owner/$slug" >> "$GITHUB_OUTPUT"
          echo "ref=@$rowner/$rslug" >> "$GITHUB_OUTPUT"
          echo "bid=$bid" >> "$GITHUB_OUTPUT"

      - name: Expo's distribution certificate (from the reference app)
        id: cert
        run: |
          info=$(node scripts/expo/ios_credentials.mjs info "${{ steps.n.outputs.ref }}")
          echo "$info"
          echo "serial=$(echo "$info" | jq -r .serial)" >> "$GITHUB_OUTPUT"

      - name: App Store provisioning profile for that certificate (App Store Connect API)
        env:
          CERT_SERIAL: ${{ steps.cert.outputs.serial }}
          PROFILE_OUT: ${{ runner.temp }}/profile.b64
        run: |
          REPORT="$RUNNER_TEMP/profile.md" python scripts/asc/asc.py profile "${{ inputs.app }}"
          grep -v 'mobileprovision\|^```\|^[A-Za-z0-9+/=]\{60,\}$' "$RUNNER_TEMP/profile.md" >> "$GITHUB_STEP_SUMMARY" || true
          test -s "$RUNNER_TEMP/profile.b64"

      - name: Upload to Expo and link to the app
        run: node scripts/expo/ios_credentials.mjs setup "${{ steps.n.outputs.full }}" "${{ steps.n.outputs.bid }}" "${{ steps.n.outputs.ref }}" "$RUNNER_TEMP/profile.b64" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start the TestFlight build on GitHub's Mac
        if: inputs.build
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/ship-mac.yml/dispatches" -f ref=main -f "inputs[app]=${{ inputs.app }}"
          echo "Dispatched ship-mac for ${{ inputs.app }}" >> "$GITHUB_STEP_SUMMARY"
