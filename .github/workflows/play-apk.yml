name: Backspin Android gameplay

on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder to compile (test package only)
        type: choice
        default: backspin
        options: [backspin]
      smoke:
        description: Install and launch on an Android emulator
        type: boolean
        default: true
      artifactRun:
        description: Optional existing run ID; reuse its verified APK for emulator testing
        type: string
        default: ''
      productionBundle:
        description: Also prepare an unsigned production-package AAB after gameplay passes (not uploadable until signed)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP: ${{ inputs.app || 'crochet' }}
      PLAY_VARIANT: preview
      EAS_BUILD_PLATFORM: android
      GLAZE_NATIVE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the PR's actual head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install and generate the isolated Android project
        if: inputs.artifactRun == '' || inputs.app == 'backspin'
        shell: bash
        run: |
          case "$APP" in crochet|glaze|linework|couch|cue|backspin|satchel) ;; *) exit 2;; esac
          cd "apps/$APP"
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          (cd ../.. && node --test scripts/play/backspin-config.test.cjs)
          if [ "$APP" = glaze ]; then node scripts/native-link.mjs; fi
          if [ "$APP" = backspin ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg pulseaudio pulseaudio-utils xvfb xauth libxcb-cursor0 libxkbcommon-x11-0
            python -m pip install 'uiautomator2==3.4.2'
            mkdir -p modules/backspin-pcm/android/src/androidTest/assets
            ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=0.25:sample_rate=44100' -ac 1 -c:a aac modules/backspin-pcm/android/src/androidTest/assets/tone.m4a
          fi
          npx expo prebuild --platform android --no-install
          npx expo config --type public --json > /tmp/play-config.json
          node -e 'const c=require("/tmp/play-config.json"); if(!c.android.package.endsWith(".playtest") || c.updates.enabled!==false) throw Error("Not an offline test variant")'
      - name: Compile standalone APK with the generated test key
        if: inputs.artifactRun == ''
        working-directory: apps/${{ env.APP }}/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify signature, manifest, embedded bundle and native alignment
        if: inputs.artifactRun == ''
        shell: bash
        run: |
          mkdir -p apk-output
          cp "apps/$APP/android/app/build/outputs/apk/release/app-release.apk" "apk-output/$APP-play-test.apk"
          cp /tmp/play-config.json apk-output/config.json
          git rev-parse HEAD > apk-output/source-commit.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "apk-output/$APP-play-test.apk" > apk-output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "apk-output/$APP-play-test.apk" > apk-output/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "apk-output/$APP-play-test.apk" AndroidManifest.xml > apk-output/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "apk-output/$APP-play-test.apk" > apk-output/zipalign.txt
          python scripts/play/verify_apk.py "apk-output/$APP-play-test.apk" apk-output
      - uses: actions/upload-artifact@v4
        if: inputs.artifactRun == ''
        with:
          name: ${{ env.APP }}-play-test-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
      - name: Reuse an already verified test APK
        if: inputs.artifactRun != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifactRun }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          case "$APP" in crochet|glaze|linework|couch|cue|backspin|satchel) ;; *) exit 2;; esac
          gh run download "$ARTIFACT_RUN" -n "$APP-play-test-apk" -D apk-output
          python scripts/play/verify_apk.py "apk-output/$APP-play-test.apk" apk-output
      - uses: android-actions/setup-android@v4
        if: inputs.smoke
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: false
      - name: Emulator install and launch
        if: inputs.smoke
        shell: bash
        run: bash scripts/play/smoke-apk.sh "apk-output/$APP-play-test.apk" apk-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.APP }}-android-evidence
          path: |
            apk-output/*.txt
            apk-output/*.json
            apk-output/*.png
            apk-output/*.xml
          if-no-files-found: ignore
          retention-days: 30
      - name: Prepare unsigned production bundle after verified gameplay
        if: inputs.productionBundle && inputs.smoke
        shell: bash
        env:
          PLAY_VARIANT: production
        run: |
          APK_SOURCE="$(cat apk-output/source-commit.txt)"
          [[ "$APK_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$APK_SOURCE"
          # A reused APK may validate this bundle only when all runtime inputs match.
          git diff --exit-code "$APK_SOURCE" HEAD -- apps/backspin ':!apps/backspin/docs/**' ':!apps/backspin/store/**' ':!apps/backspin/README.md' ':!apps/backspin/ops/RUNLOG.md'
          cd apps/backspin
          npx expo prebuild --platform android --no-install --clean
          npx expo config --type public --json > /tmp/play-production-config.json
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert s.count('signingConfig signingConfigs.debug') >= 1
          s=s.replace('signingConfig signingConfigs.debug', '// Unsigned candidate; durable upload signing is a separate release gate.')
          p.write_text(s)
          PY
          cd android
          ./gradlew :app:bundleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -Dorg.gradle.jvmargs=-Xmx4g
          cd ../../..
          mkdir -p aab-output
          cp apps/backspin/android/app/build/outputs/bundle/release/app-release.aab aab-output/backspin-UNSIGNED.aab
          cp /tmp/play-production-config.json aab-output/config.json
          git rev-parse HEAD > aab-output/source-commit.txt
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib
          p=Path('aab-output/backspin-UNSIGNED.aab')
          c=json.loads(Path('aab-output/config.json').read_text())
          assert c['android']['package']=='com.jared797.backspin' and c['updates']['enabled'] is False
          with zipfile.ZipFile(p) as z:
            assert 'base/manifest/AndroidManifest.xml' in z.namelist()
            assert 'base/assets/index.android.bundle' in z.namelist()
            assert not any(n.startswith('META-INF/') and n.endswith(('.RSA','.DSA','.EC')) for n in z.namelist())
          Path('aab-output/receipt.json').write_text(json.dumps(dict(status='UNSIGNED_NOT_UPLOADABLE',sha256=hashlib.sha256(p.read_bytes()).hexdigest(),bytes=p.stat().st_size,package=c['android']['package'],signing='Durable upload key and final signature required; do not submit this unsigned file'),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.productionBundle && inputs.smoke
        with:
          name: backspin-unsigned-production-bundle
          path: aab-output/
          if-no-files-found: error
          retention-days: 30
