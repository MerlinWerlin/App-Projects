name: Glaze Artwork coverage
# Owner 2026-11-14: every published theme pack must fill the Artwork 1-5 widgets with real pieces.
# Reads each pack's latest manifest from the pack releases and checks it with the app's own rules
# (apps/glaze/scripts/packs/artwork-coverage.mjs). Runs when the pack lists or the rules change.
on:
  pull_request:
    paths:
      - 'apps/glaze/scripts/packs/**'
      - 'apps/glaze/src/core/artworkCoverage.ts'
      - 'apps/glaze/src/core/themeArtSync.ts'
      - 'apps/glaze/src/core/widgetOptions.ts'
      - 'apps/glaze/src/core/liveArt.ts'
      - '.github/workflows/glaze-artwork-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'apps/glaze/scripts/packs/**'
      - 'apps/glaze/src/core/artworkCoverage.ts'
      - 'apps/glaze/src/core/themeArtSync.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Artwork 1-5 for every published pack
        working-directory: apps/glaze
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/packs/artwork-coverage.mjs --download --check
