name: Publish Glaze packs to Cloudflare R2

# Manual only. Rebuilds the complete current pack set exactly as glaze-publish-packs.yml does
# (verified R2 baseline + the reviewed pack-artwork additions), then uploads it to the R2
# bucket in the normal folder layout (catalog.json, art/<id>/v<n>/...). Order: immutable hashed
# files, then manifests, then catalog.json last. Objects already in the bucket with the same bytes
# are skipped, so re-running is safe. Every object is then HEAD- and SHA-256-checked over the
# public URL the app uses. Secrets are passed as env to the upload step only and never printed.
# Docs: apps/glaze/docs/PACK_HOSTING.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, verify and plan only (no uploads)'
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: glaze-publish-r2
  cancel-in-progress: false

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/glaze
    env:
      PUBLIC_URL: ${{ vars.GLAZE_R2_PUBLIC_URL }}
      OUT: dist/artwork-packs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned image verification dependency
        run: python -m pip install -r scripts/packs/requirements-images.txt
      - name: Tests and all source themes must be complete
        run: |
          node --test "scripts/packs/*.test.mjs"
          node scripts/packs/artwork_progress.mjs --complete --markdown
          python scripts/packs/verify_artwork_images.py
      - name: The verified baseline is still the live R2 catalogue
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const lock=JSON.parse(readFileSync('scripts/packs/artwork-baseline/baseline-lock.json'));
          const url=new URL(lock.catalogUrl);url.searchParams.set('preflight',String(Date.now()));
          const response=await fetch(url,{signal:AbortSignal.timeout(90000)});
          if(!response.ok)throw Error(`Live catalogue HTTP ${response.status}`);
          const sha=createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
          if(sha!==lock.catalogSha256)throw Error('Live R2 catalogue changed. Reconcile the new packs before publishing.');
          console.log('Live R2 catalogue matches the reviewed baseline');
          NODE
      - name: Download and verify original pack bytes
        run: node scripts/packs/cache_artwork_baseline.mjs --snapshot scripts/packs/artwork-baseline --out dist/published-cache
      - name: Offline complete rebuild (baseline + new artwork)
        run: |
          node scripts/packs/build_packs.mjs --base-packs dist/published-cache --add-art pack-artwork --out "$OUT" --release glaze-packs-v21 --complete
          node scripts/packs/verify_artwork_build.mjs --dir "$OUT" --complete --output "$OUT/artwork-preservation.json"
      - name: Plan and size check (free tier is 10 GB)
        run: |
          node scripts/packs/publish_r2.mjs --dir "$OUT" --dry-run > dist/r2-plan.txt
          head -1 dist/r2-plan.txt
          node --input-type=module <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import {planUpload} from './scripts/packs/publish_r2.mjs';
          const plan=planUpload(process.env.OUT);
          const bytes=plan.reduce((n,p)=>n+p.size,0), kinds={};
          for(const p of plan)kinds[p.kind]=(kinds[p.kind]??0)+1;
          console.log(`### R2 upload plan\n\n${plan.length} objects (${kinds.file} files, ${kinds.manifest} manifests, ${kinds.catalog} catalogue), ${(bytes/1e6).toFixed(1)} MB = ${(bytes/1e9*100/10).toFixed(2)}% of the free 10 GB.`);
          if(plan.at(-1).key!=='catalog.json')throw Error('catalog.json must be uploaded last');
          if(bytes>9e9)throw Error('Pack set is over 9 GB: check the R2 free tier before publishing');
          NODE
      - name: Keep the exact build for review
        uses: actions/upload-artifact@v4
        with:
          name: glaze-r2-pack-build
          path: |
            apps/glaze/dist/artwork-packs
            apps/glaze/dist/r2-plan.txt
          retention-days: 7
      - name: Upload to R2 (files, manifests, catalog.json last; skips identical objects)
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/packs/publish_r2.mjs --dir "$OUT" --concurrency 8
      - name: Verify every object over the public URL (HEAD + SHA-256)
        if: ${{ !inputs.dry_run }}
        run: |
          [ -n "$PUBLIC_URL" ] || { echo 'repo variable GLAZE_R2_PUBLIC_URL is not set'; exit 1; }
          node scripts/packs/verify_r2_public.mjs --dir "$OUT" --base "$PUBLIC_URL" --concurrency 4 | tee -a "$GITHUB_STEP_SUMMARY"
