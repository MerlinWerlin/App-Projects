name: Publish Glaze packs to Cloudflare R2

# STAGE-ONLY variant for branch claude/glaze-r2-stage-20261122. DO NOT MERGE: main keeps the full publisher.
# Uploads only the content-hashed files of brand-new themes. Never writes catalog.json or a manifest,
# so nothing becomes visible in the app until the release publishes the catalogue.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, verify and plan only (no uploads)'
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: glaze-publish-r2
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/claude/glaze-r2-stage-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/glaze
    env:
      PUBLIC_URL: ${{ vars.GLAZE_R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/packs/requirements-images.txt
      - name: Build and audit the new themes
        run: |
          node scripts/packs/extraordinary_themes.mjs
          python scripts/packs/verify_extraordinary_images.py
      - name: Plan (no writes)
        run: node scripts/packs/stage_new_theme_files.mjs --base "$PUBLIC_URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stage hashed files and verify public bytes
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/packs/stage_new_theme_files.mjs --base "$PUBLIC_URL" --upload | tee -a "$GITHUB_STEP_SUMMARY"
