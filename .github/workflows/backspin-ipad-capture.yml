name: Backspin iPad release captures

on:
  workflow_dispatch:
    inputs:
      set:
        description: 'ipad = release captures; iphone-design = every main screen on an iPhone, dark and light; iphone-fit = small and Pro Max iPhones plus the largest text size'
        type: choice
        options: [ipad, iphone-design, iphone-fit]
        default: ipad

permissions:
  contents: read

concurrency:
  group: backspin-ipad-capture-${{ inputs.set }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: inputs.set != 'iphone-design' && inputs.set != 'iphone-fit'
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/backspin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - name: Prepare isolated simulator build
        run: |
          # Backspin ships without expo-updates (1.0.1+), so the build already embeds only this commit's code.
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install > "$RUNNER_TEMP/backspin-pods.log" 2>&1 || { tail -100 "$RUNNER_TEMP/backspin-pods.log"; exit 1; }
      - name: Boot a 13-inch iPad
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os
          devices=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          candidates=[d for runtime,ds in devices.items() if 'iOS' in runtime for d in ds if 'iPad Pro 13' in d['name'] or 'iPad Pro (12.9-inch)' in d['name']]
          if not candidates: raise SystemExit('No 13-inch or 12.9-inch iPad simulator installed')
          d=candidates[0]
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('IPAD_UDID='+d['udid']+'\n')
          print('Capture device:',d['name'])
          PY
          DEVICE=$(python3 -c 'import os; print([x.split("=",1)[1].strip() for x in open(os.environ["GITHUB_ENV"]) if x.startswith("IPAD_UDID=")][-1])')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Build the actual iPad app
        run: |
          xcodebuild -workspace ios/Backspin.xcworkspace -scheme Backspin -configuration Release \
            -sdk iphonesimulator -destination "id=$IPAD_UDID" -derivedDataPath "$RUNNER_TEMP/backspin-derived" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/backspin-simulator.log" 2>&1 \
            || { tail -180 "$RUNNER_TEMP/backspin-simulator.log"; exit 1; }
      - name: Capture first launch and app routes
        run: |
          mkdir -p "$RUNNER_TEMP/backspin-ipad"
          APP="$RUNNER_TEMP/backspin-derived/Build/Products/Release-iphonesimulator/Backspin.app"
          xcrun simctl install "$IPAD_UDID" "$APP"
          xcrun simctl ui "$IPAD_UDID" appearance dark
          xcrun simctl status_bar "$IPAD_UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl privacy "$IPAD_UDID" grant microphone com.jared797.backspin
          xcrun simctl launch "$IPAD_UDID" com.jared797.backspin
          sleep 20
          xcrun simctl io "$IPAD_UDID" screenshot "$RUNNER_TEMP/backspin-ipad/01-first-launch.png"
          for ROUTE in packs party settings; do
            xcrun simctl openurl "$IPAD_UDID" "backspin://$ROUTE"
            sleep 5
            xcrun simctl io "$IPAD_UDID" screenshot "$RUNNER_TEMP/backspin-ipad/$ROUTE.png"
          done
          printf 'Source: %s\nDevice: %s\nActual simulator captures, not physical-device QA. Inspect every image before using in the listing.\n' "$GITHUB_SHA" "$IPAD_UDID" > "$RUNNER_TEMP/backspin-ipad/README.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backspin-ipad-captures
          path: |
            ${{ runner.temp }}/backspin-ipad
            ${{ runner.temp }}/backspin-simulator.log
            ${{ runner.temp }}/backspin-pods.log
          retention-days: 30

  # Design review captures: real simulator renders of every main screen, dark and light, with seeded play data so
  # Home, Takes and the free-goes chip show real states. Storage is seeded by writing AsyncStorage's manifest.
  design:
    if: inputs.set == 'iphone-design' || inputs.set == 'iphone-fit'
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/backspin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
      - run: npm ci --no-audit --no-fund
      - name: Prebuild
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install > "$RUNNER_TEMP/backspin-pods.log" 2>&1 || { tail -100 "$RUNNER_TEMP/backspin-pods.log"; exit 1; }
      - name: Boot an iPhone Pro
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os,re
          devices=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          c=[d for r,ds in devices.items() if 'iOS' in r for d in ds if re.fullmatch(r'iPhone 1[5-9] Pro',d['name'])]
          if not c: raise SystemExit('No iPhone Pro simulator')
          c.sort(key=lambda d:d['name']); d=c[-1]
          env=open(os.environ['GITHUB_ENV'],'a')
          env.write('UDID='+d['udid']+'\n'); print('Capture device:',d['name'])
          # Fit check devices: the narrowest iPhone installed and the largest Pro Max.
          ph=[x for r,ds in devices.items() if 'iOS' in r for x in ds if x['name'].startswith('iPhone')]
          rank=lambda n:0 if 'SE' in n else 1 if 'mini' in n else 2 if '16e' in n else 9
          small=sorted([x for x in ph if rank(x['name'])<9],key=lambda x:(rank(x['name']),x['name']))
          big=sorted([x for x in ph if re.fullmatch(r'iPhone 1[5-9] Pro Max',x['name'])],key=lambda x:x['name'])
          if small: env.write('SMALL='+small[0]['udid']+'\n'); print('Small:',small[0]['name'])
          if big: env.write('BIG='+big[-1]['udid']+'\n'); print('Pro Max:',big[-1]['name'])
          PY
      - name: Build
        run: |
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcodebuild -workspace ios/Backspin.xcworkspace -scheme Backspin -configuration Release \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/build.log" 2>&1 \
            || { tail -180 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Fit check (small iPhone, Pro Max, largest text size)
        if: inputs.set == 'iphone-fit'
        run: |
          # Light mode, no streak yet (the long "Start a streak today" label), on the narrowest iPhone, the Pro Max,
          # and the Pro at the largest accessibility text size. The same app build goes on every device.
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          BID=com.jared797.backspin
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/Backspin.app"
          seed() {  # $1 = streak days
            DATA=$(xcrun simctl get_app_container "$DEV" $BID data)
            python3 - "$DATA" "$1" <<'PY'
          import json,os,sys,datetime
          data,days=sys.argv[1],int(sys.argv[2])
          today=datetime.date.today().isoformat()
          prefs=dict(haptics=True,countdown=True,holdToRecord=False,autoplay=True,calm=False,theme='light',lang='en',introSeen=True,skin='booth')
          stats=dict(rounds=4,best=78,streak=dict(current=days,best=3,last=today if days else None),daily={})
          now=int(datetime.datetime.now().timestamp()*1000)
          takes=[dict(id='a1',at=now-3600e3,line='banana',pack='warmup',score=78,original='x',copy='x'),
                 dict(id='a2',at=now-86400e3,line='peanut butter sandwich',pack='warmup',score=61,original='x',copy='x')]
          m={'backspin.prefs.v1':json.dumps(prefs),'backspin.stats.v1':json.dumps(stats),'backspin.takes.v1':json.dumps(takes),'backspin.langHint.v1':'"done"'}
          for d in [f'{data}/Library/Application Support/com.jared797.backspin/RCTAsyncLocalStorage_V1',f'{data}/Documents/RCTAsyncLocalStorage_V1',f'{data}/Library/Application Support/RCTAsyncLocalStorage_V1']:
            os.makedirs(d,exist_ok=True); json.dump(m,open(d+'/manifest.json','w'))
          PY
          }
          route() {  # $1 name, $2 route path
            xcrun simctl terminate "$DEV" $BID 2>/dev/null || true
            if [ -n "$2" ]; then xcrun simctl launch "$DEV" $BID -backspinCaptureRoute "/$2"; else xcrun simctl launch "$DEV" $BID; fi
            sleep 11
            xcrun simctl io "$DEV" screenshot "$OUT/$1.png"
          }
          for PAIR in "${SMALL:-}:small" "${BIG:-}:promax" "$UDID:pro-largest-text"; do
            DEV=${PAIR%%:*}; L=${PAIR#*:}
            if [ -z "$DEV" ]; then echo "No simulator for $L"; continue; fi
            xcrun simctl boot "$DEV" 2>/dev/null || true; xcrun simctl bootstatus "$DEV" -b
            xcrun simctl install "$DEV" "$APP"
            xcrun simctl status_bar "$DEV" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl ui "$DEV" appearance light
            if [ "$L" = "pro-largest-text" ]; then xcrun simctl ui "$DEV" content_size accessibility-extra-extra-extra-large; fi
            seed 0
            route "$L-01-home-start-a-streak" ""
            route "$L-02-round" "round?mode=pack&line=wa72b302"
            route "$L-03-packs" "packs"
            route "$L-05-party" "party"
            route "$L-06-takes" "takes"
            route "$L-07-settings" "settings"
            route "$L-08-plus" "plus"
            route "$L-09-listen" "round?mode=pack&line=wa72b302&preview=listen"
            route "$L-11-score" "round?mode=pack&line=wa72b302&preview=reveal"
            seed 3
            route "$L-01-home-streak" ""
            xcrun simctl shutdown "$DEV" 2>/dev/null || true
          done
          printf 'Source: %s\nFit check captures.\n' "$GITHUB_SHA" > "$OUT/README.txt"
      - name: Capture
        if: inputs.set == 'iphone-design'
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          BID=com.jared797.backspin
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/Backspin.app"
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl privacy "$UDID" grant microphone $BID
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          seed() {  # $1 = theme, $2 = introSeen
            python3 - "$DATA" "$1" "$2" <<'PY'
          import json,os,sys,datetime
          data,theme,intro=sys.argv[1],sys.argv[2],sys.argv[3]=='1'
          today=datetime.date.today().isoformat()
          prefs=dict(haptics=True,countdown=True,holdToRecord=False,autoplay=True,calm=False,theme=theme,lang='en',introSeen=intro,skin='booth')
          stats=dict(rounds=4,best=78,streak=dict(current=3,best=3,last=today),daily={})
          now=int(datetime.datetime.now().timestamp()*1000)
          takes=[dict(id='a1',at=now-3600e3,line='banana',pack='warmup',score=78,original='x',copy='x'),
                 dict(id='a2',at=now-86400e3,line='peanut butter sandwich',pack='warmup',score=61,original='x',copy='x'),
                 dict(id='a3',at=now-2*86400e3,line='Freestyle',pack=None,score=44,original='x',copy='x')]
          m={'backspin.prefs.v1':json.dumps(prefs),'backspin.stats.v1':json.dumps(stats),'backspin.takes.v1':json.dumps(takes),
             'backspin.langHint.v1':'"done"'}
          for d in [f'{data}/Library/Application Support/com.jared797.backspin/RCTAsyncLocalStorage_V1',f'{data}/Documents/RCTAsyncLocalStorage_V1',f'{data}/Library/Application Support/RCTAsyncLocalStorage_V1']:
            os.makedirs(d,exist_ok=True); json.dump(m,open(d+'/manifest.json','w'))
          PY
          }
          shot() { xcrun simctl io "$UDID" screenshot "$OUT/$1.png"; }
          route() {  # $1 name, $2 route path. openurl now stops at an "Open in Backspin?" prompt, so the route goes in as
            # a launch argument the app reads once at startup (app/_layout.tsx, backspinCaptureRoute).
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            if [ -n "$2" ]; then xcrun simctl launch "$UDID" $BID -backspinCaptureRoute "/$2"; else xcrun simctl launch "$UDID" $BID; fi
            sleep 11
            shot "$1"
          }
          xcrun simctl ui "$UDID" appearance dark
          seed dark 0; route dark-00-intro ""
          for MODE in dark light; do
            xcrun simctl ui "$UDID" appearance $MODE
            seed $MODE 1
            route $MODE-01-home ""
            route $MODE-02-round "round?mode=pack&line=wa72b302"
            route $MODE-03-packs "packs"
            route $MODE-04-pack "pack/warmup"
            route $MODE-05-party "party"
            route $MODE-06-takes "takes"
            route $MODE-07-settings "settings"
            route $MODE-08-plus "plus"
            route $MODE-09-listen "round?mode=pack&line=wa72b302&preview=listen"
            route $MODE-10-copy "round?mode=pack&line=wa72b302&preview=copy"
            route $MODE-11-score "round?mode=pack&line=wa72b302&preview=reveal"
          done
          printf 'Source: %s\nSimulator captures for design review.\n' "$GITHUB_SHA" > "$OUT/README.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backspin-iphone-design
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/build.log
          retention-days: 14
