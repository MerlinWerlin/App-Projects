name: Couch design capture
# Couch on an iPhone simulator, every main screen in light and dark, for design before/after review.
# Built with EXPO_PUBLIC_COUCH_CAPTURE=1 at bundle time, which loads the mock demo TVs (src/state/session.tsx) so the
# remote, Apps and TVs screens have something to show. Simulator only: no signing, nothing shipped.
on:
  workflow_dispatch:
  push:
    branches: ['claude/couch-design-*']
    paths: ['.github/workflows/couch-design-capture.yml', 'apps/couch/app/**', 'apps/couch/src/**']
concurrency:
  group: couch-design-capture-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/couch
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
      EXPO_PUBLIC_COUCH_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select current Xcode
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/install.log"; exit 1; }
      - name: Generate the iOS project
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install > "$RUNNER_TEMP/prebuild.log" 2>&1 || { tail -120 "$RUNNER_TEMP/prebuild.log"; exit 1; }
          cd ios && pod install > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -120 "$RUNNER_TEMP/pods.log"; exit 1; }
      - name: Build unsigned Release simulator app
        run: |
          set -euo pipefail
          WORKSPACE=$(python3 -c 'from pathlib import Path; print(next(Path("ios").glob("*.xcworkspace")))')
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -40; tail -160 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Capture every screen, light and dark
        timeout-minutes: 30
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/couch-captures"; mkdir -p "$OUT"
          APP=$(ls -d "$RUNNER_TEMP"/build/Build/Products/Release-iphonesimulator/*.app | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for k,v in sorted(d["devices"].items(),reverse=True) if "iOS" in k for x in v]; print(next(x["udid"] for x in xs if x["name"].endswith("Pro")))')
          xcrun simctl list devices available | grep "$DEVICE"
          codesign --force --deep --sign - "$APP"
          PREFS="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Preferences"
          mkdir -p "$PREFS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.CoreSimulator.CoreSimulatorBridge-->couch string $BUNDLE" "$PREFS/com.apple.launchservices.schemeapproval.plist" || true
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant photos "$BUNDLE" || true
          ROUTES="remote cast apps tvs settings themes plus add-tv choose-apps feedback diagnostics airplay"
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$MODE"
            for R in $ROUTES; do
              xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$DEVICE" "$BUNDLE" > /dev/null
              sleep 9
              if [ "$R" != "remote" ]; then xcrun simctl openurl "$DEVICE" "couch://$R" || true; sleep 4; fi
              xcrun simctl io "$DEVICE" screenshot "$OUT/$R-$MODE.png" > /dev/null 2>&1
            done
          done
          mkdir -p "$OUT/jpg"
          for F in "$OUT"/*.png; do sips -s format jpeg -s formatOptions 78 -Z 1300 "$F" --out "$OUT/jpg/$(basename "${F%.png}").jpg" > /dev/null; done
          printf 'Source: %s\nSimulator captures (%s), demo TVs via EXPO_PUBLIC_COUCH_CAPTURE=1.\n' "$GITHUB_SHA" "$DEVICE" > "$OUT/jpg/README.txt"
          ls -la "$OUT/jpg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couch-captures
          path: |
            ${{ runner.temp }}/couch-captures/jpg
            ${{ runner.temp }}/build.log
          retention-days: 14
