# Publish already-built Glaze theme-pack assets (flat names, from scripts/packs/release_assets.mjs)
# that sit on a branch, to a GitHub release, in the safe order: pack files, manifests, catalog.json LAST.
# Uses only the built-in GITHUB_TOKEN (no accounts, no secrets). Then checks catalog.json downloads.
name: glaze-publish-release-assets

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch holding assets/ and upload-*.txt'
        required: true
        default: 'glaze-packs-v1-assets'
        type: string
      tag:
        description: 'Release tag'
        required: true
        default: 'glaze-packs-v1'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Create the release if missing
        run: |
          gh release view "$TAG" -R "$R" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$R" --title "Glaze theme packs ($TAG)" --notes "Theme art packs for the Glaze app." --latest=false
      - name: Upload (files, manifests, catalog last; one at a time, skips files already there)
        run: |
          cd assets
          gh release view "$TAG" -R "$R" --json assets -q '.assets[] | "\(.name) \(.size)"' > ../have.txt || true
          up() {
            for try in 1 2 3 4 5 6; do
              if gh release upload "$TAG" -R "$R" --clobber "$1"; then sleep 1; return 0; fi
              echo "retry $try for $1"; sleep $((try * 30))
            done
            return 1
          }
          for list in upload-1-files.txt upload-2-manifests.txt upload-3-catalog.txt; do
            [ -s "../$list" ] || continue
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              size=$(stat -c %s "$f")
              if [ "$f" != "catalog.json" ] && grep -qxF "$f $size" ../have.txt; then continue; fi
              up "$f"
            done < "../$list"
          done
      - name: Verify
        run: |
          n=$(gh release view "$TAG" -R "$R" --json assets -q '.assets | length')
          echo "assets on release: $n" | tee -a "$GITHUB_STEP_SUMMARY"
          want=$(jq -r '.[] | select(.name=="catalog.json") | .sha256' plan.json 2>/dev/null || jq -r '.assets[]? | select(.name=="catalog.json") | .sha256' plan.json)
          got=$(curl -fsSL "https://github.com/$R/releases/download/$TAG/catalog.json" | sha256sum | cut -d' ' -f1)
          echo "catalog sha256 want $want got $got" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$want" ] || [ "$want" = "$got" ]
