name: Glaze store capture
# App Store screenshots: builds the native Glaze simulator app and captures the store screens on a 6.9-inch iPhone
# (1320 x 2868) with Maestro (deep links plus taps: "Use this theme?", Yes, View widgets, the Glaze Plus sheet).
# apps/glaze/store/capture/compose.py then lays the captions over the captures. Simulator only: no signing, no
# purchases. Run it on the release branch (any claude/glaze-store-* push, or workflow_dispatch) and copy the
# composed shots into apps/glaze/store/screenshots/6.9/.
on:
  workflow_dispatch:
  push:
    branches: ['claude/glaze-store-*']
    paths: ['.github/workflows/glaze-store-capture.yml', 'apps/glaze/store/capture/**', 'apps/glaze/app/**', 'apps/glaze/src/**', 'apps/glaze/modules/**']
concurrency:
  group: glaze-store-capture-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 80
    defaults:
      run:
        working-directory: apps/glaze
    env:
      GLAZE_NATIVE: '1'
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
      GLAZE_SIMULATOR_GROUP_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select current Xcode
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install the native build dependencies
        run: |
          set -euo pipefail
          node scripts/native-link.mjs 1
          npm install --no-audit --no-fund > "$RUNNER_TEMP/glaze-native-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/glaze-native-install.log"; exit 1; }
          node scripts/eas-native-deps.js >> "$RUNNER_TEMP/glaze-native-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/glaze-native-install.log"; exit 1; }
      - name: Generate iOS app and widget targets (OTA off for reproducible captures)
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("app.json"));if(p.expo.updates)p.expo.updates.enabled=false;fs.writeFileSync("app.json",JSON.stringify(p,null,2));'
          npx expo prebuild --platform ios --no-install > "$RUNNER_TEMP/glaze-prebuild.log" 2>&1 || { tail -120 "$RUNNER_TEMP/glaze-prebuild.log"; exit 1; }
          cd ios
          pod install > "$RUNNER_TEMP/glaze-pods.log" 2>&1 || { tail -120 "$RUNNER_TEMP/glaze-pods.log"; exit 1; }
      - name: Enable shared Group access in simulator app and extension
        run: ruby scripts/prepare-native-simulator-groups.rb ios
      - name: Build unsigned simulator app with bundled JavaScript
        run: |
          set -euo pipefail
          WORKSPACE=$(python3 -c 'from pathlib import Path; print(next(Path("ios").glob("*.xcworkspace")))')
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/glaze-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/glaze-build.log" 2>&1 || { tail -160 "$RUNNER_TEMP/glaze-build.log"; exit 1; }
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture the store screens on a 6.9-inch iPhone
        timeout-minutes: 40
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/glaze-store-captures"; mkdir -p "$OUT/raw"
          APP=$(python3 -c 'import os; from pathlib import Path; print(next((Path(os.environ["RUNNER_TEMP"])/"glaze-build/Build/Products/Release-iphonesimulator").glob("*.app")))')
          BUNDLE=$(python3 -c 'import plistlib,sys,pathlib; print(plistlib.loads((pathlib.Path(sys.argv[1])/"Info.plist").read_bytes())["CFBundleIdentifier"])' "$APP")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for k,v in sorted(d["devices"].items(),reverse=True) if "iOS" in k for x in v]; print(next(x["udid"] for x in xs if "Pro Max" in x["name"]))')
          xcrun simctl list devices available | grep "$DEVICE"
          codesign --force --deep --sign - "$APP"
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
          PREFS="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Preferences"
          mkdir -p "$PREFS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.CoreSimulator.CoreSimulatorBridge-->glaze string $BUNDLE" "$PREFS/com.apple.launchservices.schemeapproval.plist" || true
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          cd store/capture
          maestro --device "$DEVICE" test -e APP_ID="$BUNDLE" --test-output-dir "$OUT/maestro" store-flow.yaml || echo "maestro reported a failure (optional steps may have missed)"
          find . "$OUT/maestro" -name '*.png' -exec cp {} "$OUT/raw/" \; 2>/dev/null || true
          ls -la "$OUT/raw"
          python3 -c 'import sys; from PIL import Image' 2>/dev/null || pip3 install --quiet --break-system-packages pillow
          python3 home.py --out "$OUT/raw/00-home-alpine-starlight.png" || echo "home failed"
          python3 compose.py --raw "$OUT/raw" --out "$OUT/6.9" || echo "compose failed"
          printf 'Source: %s\nSimulator captures (%s), Maestro. Not a physical device; no purchase claim.\n' "$GITHUB_SHA" "$DEVICE" > "$OUT/README.txt"
          ls -R "$OUT" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glaze-store-captures
          path: |
            ${{ runner.temp }}/glaze-store-captures
            ${{ runner.temp }}/glaze-build.log
          retention-days: 14
